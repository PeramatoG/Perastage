name: Windows Installer Test

on:
  workflow_dispatch:
  push:
    branches:
      - ci/windows-installer

jobs:
  smoke-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print test message
        shell: pwsh
        run: |
          Write-Host "GitHub Actions is working for Perastage."
          Write-Host "Current branch: $env:GITHUB_REF_NAME"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DPERAVIZ_ENABLE_NATIVE=OFF