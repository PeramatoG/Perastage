name: CI Debug Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact branch, tag, or commit to test.
        required: false
        type: string
        default: ""
      profile:
        description: Test profile to run.
        required: false
        type: choice
        options:
          - pr
          - release
        default: pr
  workflow_call:
    inputs:
      source_ref:
        description: Exact branch, tag, or commit to test.
        required: false
        type: string
      profile:
        description: Test profile to run.
        required: false
        type: string
        default: release

permissions:
  contents: read
  packages: read

env:
  PERASTAGE_CI_PROFILE: ${{ inputs.profile || 'pr' }}

concurrency:
  group: ci-debug-tests-${{ github.event.pull_request.number || inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      sccache_gha_enabled: ${{ steps.resolve.outputs.sccache_gha_enabled }}
      sccache_backend: ${{ steps.resolve.outputs.sccache_backend }}
      sccache_cache_scope: ${{ steps.resolve.outputs.sccache_cache_scope }}
      sccache_scope_reason: ${{ steps.resolve.outputs.sccache_scope_reason }}
      cache_warming: ${{ steps.resolve.outputs.cache_warming }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
      - name: Resolve exact source commit
        id: resolve
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_ref=${{ inputs.source_ref != '' && inputs.source_ref || github.event.pull_request.head.sha || github.ref }}" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          trusted_main_sha="$(git rev-parse refs/remotes/origin/main)"
          python3 .github/scripts/resolve_sccache_scope.py \
            --event '${{ github.event_name }}' \
            --github-ref '${{ github.ref }}' \
            --source-sha "$sha" \
            --trusted-main-sha "$trusted_main_sha" \
            --requested-ref '${{ inputs.source_ref }}'
          { echo "Testing exact commit: $sha"; echo "Trusted main commit: $trusted_main_sha"; } >> "$GITHUB_STEP_SUMMARY"

  linux-debug:
    needs: resolve-source
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED: ${{ github.workspace }}/.vcpkg-cache/installed
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-cache/downloads
      VCPKG_PACKAGES: ${{ github.workspace }}/.vcpkg-cache/packages
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache/binary
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache/binary,readwrite
      CI_LOG_DIR: ${{ github.workspace }}/out/ci-logs
      SCCACHE_GHA_ENABLED: ${{ needs.resolve-source.outputs.sccache_gha_enabled }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-ephemeral
      SCCACHE_LOCAL_RW_MODE: READ_WRITE
      SCCACHE_BACKEND: ${{ needs.resolve-source.outputs.sccache_backend }}
      SCCACHE_CACHE_SCOPE: ${{ needs.resolve-source.outputs.sccache_cache_scope }}
      SCCACHE_SCOPE_REASON: ${{ needs.resolve-source.outputs.sccache_scope_reason }}
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_LOG: warn
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
      - name: Prepare vcpkg and diagnostics directories
        run: |
          mkdir -p "$CI_LOG_DIR" "$VCPKG_DOWNLOADS" "$VCPKG_INSTALLED" "$VCPKG_PACKAGES" "$VCPKG_BINARY_CACHE"
          { uname -a; cmake --version; ninja --version || true; } > "$CI_LOG_DIR/environment-linux-debug.txt"
      - name: Read vcpkg baseline
        id: vcpkg-baseline
        run: |
          set -euo pipefail
          baseline="$(python3 .github/scripts/get_vcpkg_baseline.py vcpkg.json)"
          echo "baseline=${baseline}" >> "$GITHUB_OUTPUT"
          echo "VCPKG_BASELINE=${baseline}" >> "$GITHUB_ENV"
      - name: Install Linux test dependencies
        run: .github/scripts/install_vcpkg_build_prerequisites.sh linux
      - name: Restore vcpkg downloads
        id: vcpkg-downloads-cache
        uses: actions/cache/restore@v5
        with:
          path: .vcpkg-cache/downloads
          key: vcpkg-downloads-v3-${{ runner.os }}-${{ runner.arch }}-x64-linux-default-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-downloads-v3-${{ runner.os }}-${{ runner.arch }}-x64-linux-default-${{ steps.vcpkg-baseline.outputs.baseline }}-
      - name: Restore vcpkg installed packages and binary archives
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .vcpkg-cache/installed
            .vcpkg-cache/packages
            .vcpkg-cache/binary
          key: vcpkg-compiled-v3-${{ runner.os }}-${{ runner.arch }}-x64-linux-default-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-compiled-v3-${{ runner.os }}-${{ runner.arch }}-x64-linux-default-${{ steps.vcpkg-baseline.outputs.baseline }}-
      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [ -d "$VCPKG_ROOT/.git" ]; then
            git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_BASELINE"
            git -C "$VCPKG_ROOT" checkout --force "$VCPKG_BASELINE"
          else
            rm -rf "$VCPKG_ROOT"
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            git -C "$VCPKG_ROOT" checkout --force "$VCPKG_BASELINE"
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Ensure Mono is available for NuGet
        shell: bash
        run: mono --version

      - name: Configure GitHub Packages binary cache
        id: vcpkg-remote-cache
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/setup_vcpkg_github_packages.py --vcpkg "$VCPKG_ROOT/vcpkg" --local-cache "$VCPKG_BINARY_CACHE" --mode read

      - name: Install vcpkg packages
        run: |
          python3 .github/scripts/vcpkg_install_retry.py --vcpkg "$VCPKG_ROOT/vcpkg" --triplet x64-linux --manifest-root "$GITHUB_WORKSPACE" \
            --install-root "$VCPKG_INSTALLED" \
            --packages-root "$VCPKG_PACKAGES" \
            --downloads-root "$VCPKG_DOWNLOADS" \
            --attempts 4 --initial-delay-seconds 30 --max-delay-seconds 120 \
            --log "$CI_LOG_DIR/vcpkg-install-linux-debug.log"
      - name: Save vcpkg downloads cache
        if: ${{ steps.vcpkg-downloads-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .vcpkg-cache/downloads
          key: ${{ steps.vcpkg-downloads-cache.outputs.cache-primary-key }}
      - name: Save vcpkg installed packages and binary archives
        id: vcpkg-cache-save
        if: ${{ steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .vcpkg-cache/installed
            .vcpkg-cache/packages
            .vcpkg-cache/binary
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Summarize vcpkg cache behavior
        if: ${{ always() }}
        run: |
          python3 .github/scripts/write_vcpkg_cache_summary.py --platform linux-debug --triplet x64-linux --baseline "${{ steps.vcpkg-baseline.outputs.baseline }}" --schema v3 --primary-key "${{ steps.vcpkg-cache.outputs.cache-primary-key }}" --downloads-hit "${{ steps.vcpkg-downloads-cache.outputs.cache-hit }}" --compiled-hit "${{ steps.vcpkg-cache.outputs.cache-hit }}" --compiled-save-outcome "${{ steps.vcpkg-cache-save.outcome }}" --remote-mode read --remote-enabled "${{ steps.vcpkg-remote-cache.outputs.remote-enabled }}" --remote-setup-result "${{ steps.vcpkg-remote-cache.outputs.setup-result }}" --fallback-local-only "${{ steps.vcpkg-remote-cache.outputs.fallback-local-only }}" --publish-permitted no --publication-verification not-applicable

      - name: Validate Linux test tools and locale
        run: |
          set -euo pipefail
          sudo locale-gen es_ES.UTF-8 zh_CN.UTF-8
          locale -a | grep -qi '^es_ES.utf8$' || { echo "es_ES.UTF-8 locale was not generated"; exit 1; }
          locale -a | grep -qi '^zh_CN.utf8$' || { echo "zh_CN.UTF-8 locale was not generated"; exit 1; }
          for tool in rg xvfb-run locale xdpyinfo; do command -v "$tool" >/dev/null || { echo "Required Linux test tool is missing: $tool"; exit 1; }; done
      - name: Define Linux sccache compatibility boundary
        run: |
          set -euo pipefail
          compiler_identity="$(gcc -dumpfullversion -dumpversion)-$(gcc -dumpmachine)"
          namespace="perastage-ci-debug-v1-linux-${{ runner.arch }}-gcc-${compiler_identity}-debug"
          if [ "$SCCACHE_GHA_ENABLED" = on ]; then echo "SCCACHE_GHA_VERSION=$namespace" >> "$GITHUB_ENV"; fi
          echo "SCCACHE_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          echo "SCCACHE_COMPILER_IDENTITY=gcc-$compiler_identity" >> "$GITHUB_ENV"
          echo "SCCACHE_ERROR_LOG=$CI_LOG_DIR/sccache-linux-debug-error.log" >> "$GITHUB_ENV"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.15.0
      - name: Initialize Linux sccache statistics
        run: |
          "$SCCACHE_PATH" --version | tee "$CI_LOG_DIR/sccache-linux-debug-version.txt"
          "$SCCACHE_PATH" --version | grep -F 'sccache 0.15.0'
          "$SCCACHE_PATH" --start-server
          "$SCCACHE_PATH" --zero-stats
      - name: Write Linux compiler-cache initial cache
        run: python3 .github/scripts/write_cmake_compiler_cache_init.py --launcher "$SCCACHE_PATH" --output "$CI_LOG_DIR/cmake-compiler-cache-linux-debug.cmake"
      - name: Configure Debug tests
        id: cmake-configure
        run: |
          python3 .github/scripts/run_and_log.py --log "$CI_LOG_DIR/cmake-configure-linux-debug.log" -- cmake -S . -B build/linux-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED" -DVCPKG_MANIFEST_MODE=OFF -DBUILD_TESTING=ON -DPERASTAGE_REQUIRE_SECURE_CREDENTIAL_STORE=ON -DPERASTAGE_ENABLE_COMPILER_CACHE=ON -C "$CI_LOG_DIR/cmake-compiler-cache-linux-debug.cmake"
          test -f build/linux-debug/compile_commands.json || { echo "Debug compile_commands.json was not generated"; exit 1; }
          if grep -Eq '(^|[[:space:]])-DNDEBUG([[:space:]]|$)' build/linux-debug/compile_commands.json; then echo "Debug tests must not compile with NDEBUG"; exit 1; fi
          python3 .github/scripts/validate_cmake_toolchain.py --build-dir build/linux-debug --expected-c-id GNU --expected-cxx-id GNU --expected-generator Ninja --expected-build-type Debug --expected-launcher "$SCCACHE_PATH"
      - name: Generate Linux CTest inventory
        run: |
          ctest --test-dir build/linux-debug -N -V > "$CI_LOG_DIR/ctest-inventory-linux-debug.txt"
          ctest --test-dir build/linux-debug --show-only=json-v1 > "$CI_LOG_DIR/ctest-inventory-linux-debug.json"
      - name: Build complete test target set
        id: perastage-build
        run: python3 .github/scripts/run_and_log.py --log "$CI_LOG_DIR/build-linux-debug.log" -- cmake --build build/linux-debug --target all --verbose
      - name: Capture Linux sccache statistics
        if: ${{ always() }}
        run: |
          "$SCCACHE_PATH" --show-stats > "$CI_LOG_DIR/sccache-linux-debug.txt"
          "$SCCACHE_PATH" --show-stats --stats-format json > "$CI_LOG_DIR/sccache-linux-debug.json"
          python3 .github/scripts/write_sccache_summary.py --stats-json "$CI_LOG_DIR/sccache-linux-debug.json" --compile-commands build/linux-debug/compile_commands.json --platform linux-debug --architecture "${{ runner.arch }}" --backend "$SCCACHE_BACKEND" --cache-scope "$SCCACHE_CACHE_SCOPE" --scope-reason "$SCCACHE_SCOPE_REASON" --namespace "$SCCACHE_NAMESPACE" --compiler-identity "$SCCACHE_COMPILER_IDENTITY" --base-directory "$SCCACHE_BASEDIRS" --launcher-validation "${{ steps.cmake-configure.outcome == 'success' && 'passed' || 'failed' }}" --build-succeeded "${{ steps.perastage-build.outcome == 'success' }}"
      - name: Validate Linux Xvfb display
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'echo "DISPLAY=$DISPLAY" > "$CI_LOG_DIR/xvfb-linux-debug.txt"; test -n "$DISPLAY"; xdpyinfo >> "$CI_LOG_DIR/xvfb-linux-debug.txt"'
      - name: Run complete CTest suite
        if: ${{ needs.resolve-source.outputs.cache_warming != 'true' }}
        run: |
          set +e
          LC_ALL=C.UTF-8 LANG=C.UTF-8 xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build/linux-debug --output-log "$CI_LOG_DIR/ctest-linux-debug.log" --output-junit "$CI_LOG_DIR/ctest-linux-debug.junit.xml" --output-on-failure --verbose
          ctest_exit=$?
          python3 .github/scripts/summarize_ctest_failures.py --platform linux --junit "$CI_LOG_DIR/ctest-linux-debug.junit.xml" --log "$CI_LOG_DIR/ctest-linux-debug.log" --last-tests-failed build/linux-debug/Testing/Temporary/LastTestsFailed.log --output "$CI_LOG_DIR/ctest-linux-debug-failures.csv"
          python3 .github/scripts/summarize_ctest_results.py --platform linux --junit "$CI_LOG_DIR/ctest-linux-debug.junit.xml" --output "$CI_LOG_DIR/ctest-linux-debug-results.json" --tested-sha "${{ needs.resolve-source.outputs.source_sha }}" --profile "$PERASTAGE_CI_PROFILE"
          exit $ctest_exit
      - name: Run repository policy tests
        run: |
          export PERASTAGE_TEST_PYTHON="$(command -v python3)"
          bash tests/check_perastage_tree_modules.sh
          bash tests/check_no_configmanager_get_in_gui.sh
          bash tests/check_ci_cmake_language_policy.sh
      - name: Upload Linux test results
        if: ${{ always() && needs.resolve-source.outputs.cache_warming != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-linux-debug-test-results
          if-no-files-found: ignore
          path: |
            out/ci-logs/ctest-inventory-linux-debug.*
            out/ci-logs/sccache-linux-debug*
            out/ci-logs/ctest-linux-debug.junit.xml
            out/ci-logs/ctest-linux-debug.log
            out/ci-logs/ctest-linux-debug-failures.csv
            out/ci-logs/ctest-linux-debug-results.json
            build/linux-debug/Testing/Temporary/LastTestsFailed.log
            build/linux-debug/Testing/Temporary/LastTestsDisabled.log
      - name: Upload failure diagnostics
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-linux-debug-diagnostics
          if-no-files-found: ignore
          path: |
            out/ci-logs/**
            **/CMakeFiles/CMakeConfigureLog.yaml
            **/CMakeCache.txt
            build/**/*.log
            build/**/Testing/Temporary/**
            vcpkg/buildtrees/**/*.log
            vcpkg/buildtrees/**/config-*.txt
            vcpkg/buildtrees/**/issue_body.md
            .vcpkg-cache/installed/vcpkg/issue_body.md

  windows-debug:
    timeout-minutes: 180
    needs: resolve-source
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_INSTALLED: ${{ github.workspace }}\.vcpkg-cache\installed
      VCPKG_DOWNLOADS: ${{ github.workspace }}\.vcpkg-cache\downloads
      VCPKG_PACKAGES: ${{ github.workspace }}\.vcpkg-cache\packages
      VCPKG_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache\binary
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache\binary,readwrite
      CI_LOG_DIR: ${{ github.workspace }}\out\ci-logs
      SCCACHE_GHA_ENABLED: ${{ needs.resolve-source.outputs.sccache_gha_enabled }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-ephemeral
      SCCACHE_LOCAL_RW_MODE: READ_WRITE
      SCCACHE_BACKEND: ${{ needs.resolve-source.outputs.sccache_backend }}
      SCCACHE_CACHE_SCOPE: ${{ needs.resolve-source.outputs.sccache_cache_scope }}
      SCCACHE_SCOPE_REASON: ${{ needs.resolve-source.outputs.sccache_scope_reason }}
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_LOG: warn
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
      - name: Prepare vcpkg and diagnostics directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:CI_LOG_DIR,$env:VCPKG_DOWNLOADS,$env:VCPKG_INSTALLED,$env:VCPKG_PACKAGES,$env:VCPKG_BINARY_CACHE -Force | Out-Null
          $python = (Get-Command python -ErrorAction Stop).Source
          "PERASTAGE_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cmake --version | Out-File "$env:CI_LOG_DIR\environment-windows-debug.txt"
          & $python --version | Out-File "$env:CI_LOG_DIR\environment-windows-debug.txt" -Append
      - name: Prepare Windows Debug test tools
        id: windows-test-tools
        shell: pwsh
        run: |
          $log = "$env:CI_LOG_DIR\windows-test-tools.txt"
          $rgCommand = Get-Command rg.exe -ErrorAction SilentlyContinue
          if (-not $rgCommand) {
            $choco = Get-Command choco.exe -ErrorAction SilentlyContinue
            if (-not $choco) { throw 'ripgrep is not installed and Chocolatey is unavailable.' }
            & $choco.Source install ripgrep -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'ripgrep installation failed.' }
            $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH', 'User') + ';' + $env:PATH
            $rgCommand = Get-Command rg.exe -ErrorAction SilentlyContinue
          }
          if (-not $rgCommand) { throw 'ripgrep is not installed after Windows Debug test-tool preparation.' }
          $rgPath = $rgCommand.Source
          $rgDir = Split-Path -Parent $rgPath
          $env:PATH = "$rgDir;$env:PATH"
          $rgDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "rg=$rgPath" | Out-File -FilePath $log -Encoding utf8
          & $rgPath --version | Out-File -FilePath $log -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "ripgrep failed to run from PowerShell: $rgPath" }
          "PERASTAGE_RG=$rgPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Resolve Git Bash for Windows tests
        id: git-bash
        shell: pwsh
        run: |
          $log = "$env:CI_LOG_DIR\git-bash-windows-debug.txt"
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $gitRoot = Split-Path -Parent (Split-Path -Parent $git)
          $bash = Join-Path $gitRoot 'bin\bash.exe'
          "git=$git" | Out-File -FilePath $log -Encoding utf8
          "bash=$bash" | Out-File -FilePath $log -Append -Encoding utf8
          "rg=$env:PERASTAGE_RG" | Out-File -FilePath $log -Append -Encoding utf8
          if (-not (Test-Path $bash)) { throw "Git Bash was not found at expected path: $bash" }
          $normalized = $bash.Replace('/', '\').ToLowerInvariant()
          if ($normalized -match '\\windowsapps\\bash\.exe$' -or $normalized -match '\\system32\\bash\.exe$') { throw "Refusing WSL bash launcher: $bash" }
          if ($normalized -notmatch '\\git\\.*\\bash\.exe$') { throw "Refusing Bash outside Git for Windows: $bash" }
          & $bash --version | Out-File -FilePath $log -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Git Bash identity probe failed: $bash" }
          & $bash --noprofile --norc -c 'printf "git-bash-ok\n"' | Out-File -FilePath $log -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Git Bash cannot execute a non-login shell: $bash" }
          & $env:PERASTAGE_RG --version | Out-File -FilePath $log -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "ripgrep failed to run from PowerShell: $env:PERASTAGE_RG" }
          & $bash --noprofile --norc -c 'command -v rg && rg --version' | Out-File -FilePath $log -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "ripgrep was not inherited by Git Bash: $env:PERASTAGE_RG" }
          "PERASTAGE_GIT_BASH=$bash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "path=$bash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Read vcpkg baseline
        id: vcpkg-baseline
        shell: pwsh
        run: |
          $baseline = (& "$env:PERASTAGE_PYTHON" .github/scripts/get_vcpkg_baseline.py vcpkg.json).Trim()
          "baseline=$baseline" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "VCPKG_BASELINE=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore vcpkg downloads
        id: vcpkg-downloads-cache
        uses: actions/cache/restore@v5
        with:
          path: .vcpkg-cache/downloads
          key: vcpkg-downloads-v3-${{ runner.os }}-${{ runner.arch }}-x64-windows-default-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-downloads-v3-${{ runner.os }}-${{ runner.arch }}-x64-windows-default-${{ steps.vcpkg-baseline.outputs.baseline }}-
      - name: Restore vcpkg installed packages and binary archives
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .vcpkg-cache\installed
            .vcpkg-cache\packages
            .vcpkg-cache\binary
          key: vcpkg-compiled-v3-${{ runner.os }}-${{ runner.arch }}-x64-windows-default-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-compiled-v3-${{ runner.os }}-${{ runner.arch }}-x64-windows-default-${{ steps.vcpkg-baseline.outputs.baseline }}-
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (Test-Path "$env:VCPKG_ROOT\.git") {
            git -C $env:VCPKG_ROOT fetch --depth 1 origin $env:VCPKG_BASELINE
            git -C $env:VCPKG_ROOT checkout --force $env:VCPKG_BASELINE
          } else {
            if (Test-Path $env:VCPKG_ROOT) { Remove-Item $env:VCPKG_ROOT -Recurse -Force }
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
            git -C $env:VCPKG_ROOT checkout --force $env:VCPKG_BASELINE
          }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure GitHub Packages binary cache
        id: vcpkg-remote-cache
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/setup_vcpkg_github_packages.py --vcpkg "$env:VCPKG_ROOT\vcpkg.exe" --local-cache "$env:VCPKG_BINARY_CACHE" --mode read

      - name: Install vcpkg packages
        shell: pwsh
        run: |
          & "$env:PERASTAGE_PYTHON" .github/scripts/vcpkg_install_retry.py --vcpkg "$env:VCPKG_ROOT\vcpkg.exe" --triplet x64-windows --manifest-root "$env:GITHUB_WORKSPACE" `
            --install-root "$env:VCPKG_INSTALLED" `
            --packages-root "$env:VCPKG_PACKAGES" `
            --downloads-root "$env:VCPKG_DOWNLOADS" `
            --attempts 4 --initial-delay-seconds 30 --max-delay-seconds 120 `
            --log "$env:CI_LOG_DIR\vcpkg-install-windows-debug.log"
      - name: Save vcpkg downloads cache
        if: ${{ steps.vcpkg-downloads-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .vcpkg-cache/downloads
          key: ${{ steps.vcpkg-downloads-cache.outputs.cache-primary-key }}
      - name: Save vcpkg installed packages and binary archives
        id: vcpkg-cache-save
        if: ${{ steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .vcpkg-cache\installed
            .vcpkg-cache\packages
            .vcpkg-cache\binary
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Summarize vcpkg cache behavior
        if: ${{ always() }}
        shell: pwsh
        run: |
          & "$env:PERASTAGE_PYTHON" .github/scripts/write_vcpkg_cache_summary.py --platform windows --triplet x64-windows --baseline "${{ steps.vcpkg-baseline.outputs.baseline }}" --schema v3 --primary-key "${{ steps.vcpkg-cache.outputs.cache-primary-key }}" --downloads-hit "${{ steps.vcpkg-downloads-cache.outputs.cache-hit }}" --compiled-hit "${{ steps.vcpkg-cache.outputs.cache-hit }}" --compiled-save-outcome "${{ steps.vcpkg-cache-save.outcome }}" --remote-mode read --remote-enabled "${{ steps.vcpkg-remote-cache.outputs.remote-enabled }}" --remote-setup-result "${{ steps.vcpkg-remote-cache.outputs.setup-result }}" --fallback-local-only "${{ steps.vcpkg-remote-cache.outputs.fallback-local-only }}" --publish-permitted no --publication-verification not-applicable

      - name: Persist Visual Studio Hostx64 x64 environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vsRoot)) { throw 'No Visual Studio installation with x64 C++ tools was found.' }
          $devCmd = Join-Path $vsRoot 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $devCmd)) { throw "VsDevCmd.bat was not found at: $devCmd" }
          $envDump = cmd.exe /c "`"$devCmd`" -host_arch=x64 -arch=x64 >nul && set"
          $envNames = @('INCLUDE','LIB','LIBPATH','Path','VSCMD_ARG_HOST_ARCH','VSCMD_ARG_TGT_ARCH','WindowsSdkDir','WindowsSDKVersion','VCINSTALLDIR','VCToolsInstallDir')
          foreach ($line in $envDump) {
            $separator = $line.IndexOf('=')
            if ($separator -le 0) { continue }
            $name = $line.Substring(0, $separator)
            $value = $line.Substring($separator + 1)
            Set-Item -Path "Env:$name" -Value $value
            if ($envNames -contains $name) {
              if ($name -ieq 'Path') { $value.Split(';') | Where-Object { $_ } | ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 } }
              else { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
            }
          }
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $cl) { throw 'cl.exe was not found after initializing the Visual Studio environment.' }
          $normalizedCl = $cl.Source.Replace('/', '\').ToLowerInvariant()
          if ($normalizedCl -match 'c:[\\/](mingw64|msys64)|mingw|msys|strawberry') { throw "Refusing non-MSVC compiler: $($cl.Source)" }
          if ($env:VSCMD_ARG_HOST_ARCH -ne 'x64' -or $env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw "Visual Studio is not Hostx64/x64: host=$env:VSCMD_ARG_HOST_ARCH target=$env:VSCMD_ARG_TGT_ARCH" }
      - name: Define Windows sccache compatibility boundary
        shell: pwsh
        run: |
          $cl = (Get-Command cl.exe -ErrorAction Stop).Source
          $toolset = Split-Path -Leaf $env:VCToolsInstallDir.TrimEnd('\')
          $sdk = $env:WindowsSDKVersion.TrimEnd('\')
          $namespace = "perastage-ci-debug-v1-windows-${{ runner.arch }}-msvc-$toolset-sdk-$sdk-debug"
          if ($env:SCCACHE_GHA_ENABLED -eq 'on') { "SCCACHE_GHA_VERSION=$namespace" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          "SCCACHE_NAMESPACE=$namespace" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SCCACHE_COMPILER_IDENTITY=MSVC-$toolset-WindowsSDK-$sdk-Hostx64-x64" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SCCACHE_ERROR_LOG=$env:CI_LOG_DIR\sccache-windows-debug-error.log" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.15.0
      - name: Resolve Windows sccache executable
        shell: pwsh
        run: |
          $sccacheCommand = Get-Command sccache.exe -ErrorAction Stop
          $sccacheExecutable = $sccacheCommand.Source
          if ([string]::IsNullOrWhiteSpace($sccacheExecutable)) { throw 'Get-Command returned an empty sccache.exe path.' }
          if (-not (Test-Path -LiteralPath $sccacheExecutable -PathType Leaf)) { throw "Resolved sccache executable does not exist: $sccacheExecutable" }
          if (-not $sccacheExecutable.EndsWith('.exe', [StringComparison]::OrdinalIgnoreCase)) { throw "Resolved Windows sccache executable must end in .exe: $sccacheExecutable" }
          "PERASTAGE_SCCACHE_EXECUTABLE=$sccacheExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "sccache_executable=$sccacheExecutable" | Out-File -FilePath "$env:CI_LOG_DIR\sccache-windows-debug-executable.txt" -Encoding utf8
      - name: Initialize Windows sccache statistics
        shell: pwsh
        run: |
          & $env:PERASTAGE_SCCACHE_EXECUTABLE --version | Tee-Object "$env:CI_LOG_DIR\sccache-windows-debug-version.txt"
          if ((& $env:PERASTAGE_SCCACHE_EXECUTABLE --version) -notmatch '^sccache 0\.15\.0') { throw 'Expected sccache v0.15.0.' }
          & $env:PERASTAGE_SCCACHE_EXECUTABLE --start-server
          & $env:PERASTAGE_SCCACHE_EXECUTABLE --zero-stats
      - name: Write Windows compiler-cache initial cache
        shell: pwsh
        run: |
          $clExecutable = (Get-Command cl.exe -ErrorAction Stop).Source
          $bashExecutable = $env:PERASTAGE_GIT_BASH
          $sccacheExecutable = $env:PERASTAGE_SCCACHE_EXECUTABLE
          foreach ($item in @($clExecutable,$bashExecutable,$sccacheExecutable)) {
            if (-not (Test-Path -LiteralPath $item -PathType Leaf)) { throw "Required Windows build executable does not exist: $item" }
          }
          "PERASTAGE_MSVC_EXECUTABLE=$clExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "$env:PERASTAGE_PYTHON" .github/scripts/write_cmake_compiler_cache_init.py `
            --launcher "$sccacheExecutable" --c-compiler "$clExecutable" --cxx-compiler "$clExecutable" `
            --bash-executable "$bashExecutable" --policy-default-cmp0141 NEW `
            --msvc-debug-information-format Embedded --output "$env:CI_LOG_DIR\cmake-windows-debug-initial-cache.cmake"
      - name: Configure Windows Debug tests
        id: cmake-configure
        shell: pwsh
        run: |
          & "$env:PERASTAGE_PYTHON" .github/scripts/run_and_log.py --log "$env:CI_LOG_DIR\cmake-configure-windows-debug.log" -- cmake -S . -B build-windows-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED" -DVCPKG_MANIFEST_MODE=OFF -DBUILD_TESTING=ON -DPERASTAGE_REQUIRE_SECURE_CREDENTIAL_STORE=ON -DPERASTAGE_ENABLE_COMPILER_CACHE=ON -C "$env:CI_LOG_DIR\cmake-windows-debug-initial-cache.cmake" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Validate Windows Debug toolchain and sccache launcher
        shell: pwsh
        run: |
          & "$env:PERASTAGE_PYTHON" .github/scripts/run_and_log.py --log "$env:CI_LOG_DIR\cmake-toolchain-validation-windows-debug.log" -- "$env:PERASTAGE_PYTHON" .github/scripts/validate_cmake_toolchain.py --build-dir build-windows-debug --expected-c-id MSVC --expected-cxx-id MSVC --expected-compiler "$env:PERASTAGE_MSVC_EXECUTABLE" --expected-bash "$env:PERASTAGE_GIT_BASH" --expected-compiler-path-regex "Hostx64[\\/]x64" --forbidden-compiler-path-regex "(mingw|msys|strawberry|Hostx86[\\/]x86|[\\/]x86[\\/]cl\.exe)" --expected-architecture x64 --expected-generator Ninja --expected-build-type Debug --expected-launcher "$env:PERASTAGE_SCCACHE_EXECUTABLE"
      - name: Validate Windows Debug compile flags
        shell: pwsh
        run: |
          & "$env:PERASTAGE_PYTHON" .github/scripts/validate_msvc_compile_commands.py --compile-commands build-windows-debug\compile_commands.json --output "$env:CI_LOG_DIR\msvc-compile-flags-windows-debug.log"
      - name: Generate Windows CTest inventory
        shell: pwsh
        run: |
          ctest --test-dir build-windows-debug -N -V | Out-File -FilePath "$env:CI_LOG_DIR\ctest-inventory-windows-debug.txt" -Encoding utf8
          ctest --test-dir build-windows-debug --show-only=json-v1 | Out-File -FilePath "$env:CI_LOG_DIR\ctest-inventory-windows-debug.json" -Encoding utf8
      - name: Build Windows Debug tests
        id: perastage-build
        shell: pwsh
        run: |
          & "$env:PERASTAGE_PYTHON" .github/scripts/run_and_log.py --log "$env:CI_LOG_DIR\build-windows-debug.log" -- cmake --build build-windows-debug --target all --verbose
      - name: Capture Windows sccache statistics
        if: ${{ always() }}
        shell: pwsh
        run: |
          & $env:PERASTAGE_SCCACHE_EXECUTABLE --show-stats | Out-File "$env:CI_LOG_DIR\sccache-windows-debug.txt" -Encoding utf8
          & $env:PERASTAGE_SCCACHE_EXECUTABLE --show-stats --stats-format json | Out-File "$env:CI_LOG_DIR\sccache-windows-debug.json" -Encoding utf8
          & $env:PERASTAGE_PYTHON .github/scripts/write_sccache_summary.py --stats-json "$env:CI_LOG_DIR\sccache-windows-debug.json" --compile-commands build-windows-debug\compile_commands.json --platform windows-debug --architecture "${{ runner.arch }}" --backend $env:SCCACHE_BACKEND --cache-scope $env:SCCACHE_CACHE_SCOPE --scope-reason $env:SCCACHE_SCOPE_REASON --namespace $env:SCCACHE_NAMESPACE --compiler-identity $env:SCCACHE_COMPILER_IDENTITY --base-directory $env:SCCACHE_BASEDIRS --launcher-validation "${{ steps.cmake-configure.outcome == 'success' && 'passed' || 'failed' }}" --build-succeeded "${{ steps.perastage-build.outcome == 'success' }}"
      - name: Run Windows CTest suite
        if: ${{ needs.resolve-source.outputs.cache_warming != 'true' }}
        shell: pwsh
        run: |
          & ctest --test-dir build-windows-debug --output-log "$env:CI_LOG_DIR\ctest-windows-debug.log" --output-junit "$env:CI_LOG_DIR\ctest-windows-debug.junit.xml" --output-on-failure --verbose --interactive-debug-mode 0 --timeout 120
          $ctestExit = $LASTEXITCODE
          & "$env:PERASTAGE_PYTHON" .github/scripts/summarize_ctest_failures.py --platform windows --junit "$env:CI_LOG_DIR\ctest-windows-debug.junit.xml" --log "$env:CI_LOG_DIR\ctest-windows-debug.log" --last-tests-failed build-windows-debug\Testing\Temporary\LastTestsFailed.log --output "$env:CI_LOG_DIR\ctest-windows-debug-failures.csv"
          & "$env:PERASTAGE_PYTHON" .github/scripts/summarize_ctest_results.py --platform windows --junit "$env:CI_LOG_DIR\ctest-windows-debug.junit.xml" --output "$env:CI_LOG_DIR\ctest-windows-debug-results.json" --tested-sha "${{ needs.resolve-source.outputs.source_sha }}" --profile "$env:PERASTAGE_CI_PROFILE"
          exit $ctestExit
      - name: Upload Windows test results
        if: ${{ always() && needs.resolve-source.outputs.cache_warming != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-windows-debug-test-results
          if-no-files-found: ignore
          path: |
            out/ci-logs/ctest-inventory-windows-debug.*
            out/ci-logs/sccache-windows-debug*
            out/ci-logs/ctest-windows-debug.junit.xml
            out/ci-logs/ctest-windows-debug.log
            out/ci-logs/ctest-windows-debug-failures.csv
            out/ci-logs/ctest-windows-debug-results.json
            build-windows-debug/Testing/Temporary/LastTestsFailed.log
            build-windows-debug/Testing/Temporary/LastTestsDisabled.log
      - name: Upload failure diagnostics
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-windows-debug-diagnostics
          if-no-files-found: ignore
          path: |
            out/ci-logs/**
            **/CMakeFiles/CMakeConfigureLog.yaml
            **/CMakeCache.txt
            build-windows-debug/compile_commands.json
            build*/**/*.log
            build*/**/Testing/Temporary/**
            vcpkg/buildtrees/**/*.log
            vcpkg/buildtrees/**/config-*.txt
            vcpkg/buildtrees/**/issue_body.md
            .vcpkg-cache/installed/vcpkg/issue_body.md

  macos-debug:
    needs: resolve-source
    runs-on: macos-26
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED: ${{ github.workspace }}/.vcpkg-cache/installed
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-cache/downloads
      VCPKG_PACKAGES: ${{ github.workspace }}/.vcpkg-cache/packages
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache/binary
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache/binary,readwrite
      CI_LOG_DIR: ${{ github.workspace }}/out/ci-logs
      SCCACHE_GHA_ENABLED: ${{ needs.resolve-source.outputs.sccache_gha_enabled }}
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-ephemeral
      SCCACHE_LOCAL_RW_MODE: READ_WRITE
      SCCACHE_BACKEND: ${{ needs.resolve-source.outputs.sccache_backend }}
      SCCACHE_CACHE_SCOPE: ${{ needs.resolve-source.outputs.sccache_cache_scope }}
      SCCACHE_SCOPE_REASON: ${{ needs.resolve-source.outputs.sccache_scope_reason }}
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_LOG: warn
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
      - name: Prepare vcpkg and diagnostics directories
        run: |
          mkdir -p "$CI_LOG_DIR" "$VCPKG_DOWNLOADS" "$VCPKG_INSTALLED" "$VCPKG_PACKAGES" "$VCPKG_BINARY_CACHE"
          { sw_vers; uname -m; xcodebuild -version; xcrun --sdk macosx --show-sdk-path; } > "$CI_LOG_DIR/environment-macos-debug.txt"
      - name: Read vcpkg baseline
        id: vcpkg-baseline
        run: |
          set -euo pipefail
          baseline="$(python3 .github/scripts/get_vcpkg_baseline.py vcpkg.json)"
          echo "baseline=${baseline}" >> "$GITHUB_OUTPUT"
          echo "VCPKG_BASELINE=${baseline}" >> "$GITHUB_ENV"
      - name: Resolve macOS SDK cache identity
        id: macos-sdk
        run: |
          set -euo pipefail
          current_sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          current_sdk_realpath="$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve())' "$current_sdk_path")"
          xcode_version="$(xcodebuild -version | tr '\n' '-' | sed 's/-$//')"
          sdk_identity="$(printf '%s|%s' "$xcode_version" "$current_sdk_realpath" | shasum -a 256 | awk '{print $1}')"
          echo "identity=${sdk_identity}" >> "$GITHUB_OUTPUT"
          echo "MACOS_SDK_PATH=${current_sdk_path}" >> "$GITHUB_ENV"
          echo "MACOS_SDK_REALPATH=${current_sdk_realpath}" >> "$GITHUB_ENV"
      - name: Install macOS test tools
        run: .github/scripts/install_vcpkg_build_prerequisites.sh macos
      - name: Restore vcpkg downloads
        id: vcpkg-downloads-cache
        uses: actions/cache/restore@v5
        with:
          path: .vcpkg-cache/downloads
          key: vcpkg-downloads-v3-${{ runner.os }}-${{ runner.arch }}-arm64-osx-sdk-${{ steps.macos-sdk.outputs.identity }}-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-downloads-v3-${{ runner.os }}-${{ runner.arch }}-arm64-osx-sdk-${{ steps.macos-sdk.outputs.identity }}-${{ steps.vcpkg-baseline.outputs.baseline }}-
      - name: Restore vcpkg installed packages and binary archives
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .vcpkg-cache/installed
            .vcpkg-cache/packages
            .vcpkg-cache/binary
          key: vcpkg-compiled-v3-${{ runner.os }}-${{ runner.arch }}-arm64-osx-sdk-${{ steps.macos-sdk.outputs.identity }}-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-compiled-v3-${{ runner.os }}-${{ runner.arch }}-arm64-osx-sdk-${{ steps.macos-sdk.outputs.identity }}-${{ steps.vcpkg-baseline.outputs.baseline }}-
      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [ -d "$VCPKG_ROOT/.git" ]; then
            git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_BASELINE"
            git -C "$VCPKG_ROOT" checkout --force "$VCPKG_BASELINE"
          else
            rm -rf "$VCPKG_ROOT"
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            git -C "$VCPKG_ROOT" checkout --force "$VCPKG_BASELINE"
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure GitHub Packages binary cache
        id: vcpkg-remote-cache
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/setup_vcpkg_github_packages.py --vcpkg "$VCPKG_ROOT/vcpkg" --local-cache "$VCPKG_BINARY_CACHE" --mode read

      - name: Diagnose restored vcpkg SDK metadata
        run: |
          set -euo pipefail
          python3 .github/scripts/macos_sdk_cache_guard.py \
            --current-sdk "$MACOS_SDK_PATH" \
            --scan-root "$VCPKG_INSTALLED" \
            --scan-root "$VCPKG_PACKAGES" \
            --scan-root "$VCPKG_BINARY_CACHE" \
            --purge-root "$VCPKG_INSTALLED" \
            --purge-root "$VCPKG_PACKAGES" \
            --purge-root "$VCPKG_BINARY_CACHE"
      - name: Install vcpkg packages
        run: |
          python3 .github/scripts/vcpkg_install_retry.py --vcpkg "$VCPKG_ROOT/vcpkg" --triplet arm64-osx --manifest-root "$GITHUB_WORKSPACE" \
            --install-root "$VCPKG_INSTALLED" \
            --packages-root "$VCPKG_PACKAGES" \
            --downloads-root "$VCPKG_DOWNLOADS" \
            --attempts 4 --initial-delay-seconds 30 --max-delay-seconds 120 \
            --log "$CI_LOG_DIR/vcpkg-install-macos-debug.log"
      - name: Save vcpkg downloads cache
        if: ${{ steps.vcpkg-downloads-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .vcpkg-cache/downloads
          key: ${{ steps.vcpkg-downloads-cache.outputs.cache-primary-key }}
      - name: Save vcpkg installed packages and binary archives
        id: vcpkg-cache-save
        if: ${{ steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .vcpkg-cache/installed
            .vcpkg-cache/packages
            .vcpkg-cache/binary
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Summarize vcpkg cache behavior
        if: ${{ always() }}
        run: |
          python3 .github/scripts/write_vcpkg_cache_summary.py --platform macos-debug --triplet arm64-osx --baseline "${{ steps.vcpkg-baseline.outputs.baseline }}" --schema v3 --primary-key "${{ steps.vcpkg-cache.outputs.cache-primary-key }}" --downloads-hit "${{ steps.vcpkg-downloads-cache.outputs.cache-hit }}" --compiled-hit "${{ steps.vcpkg-cache.outputs.cache-hit }}" --compiled-save-outcome "${{ steps.vcpkg-cache-save.outcome }}" --remote-mode read --remote-enabled "${{ steps.vcpkg-remote-cache.outputs.remote-enabled }}" --remote-setup-result "${{ steps.vcpkg-remote-cache.outputs.setup-result }}" --fallback-local-only "${{ steps.vcpkg-remote-cache.outputs.fallback-local-only }}" --publish-permitted no --publication-verification not-applicable

      - name: Define macOS sccache compatibility boundary
        run: |
          set -euo pipefail
          clang_identity="$(clang --version | head -1 | tr ' /()' '----' | tr -cd '[:alnum:]._-')"
          namespace="perastage-ci-debug-v1-macos-${{ runner.arch }}-clang-${clang_identity}-sdk-${{ steps.macos-sdk.outputs.identity }}-debug"
          if [ "$SCCACHE_GHA_ENABLED" = on ]; then echo "SCCACHE_GHA_VERSION=$namespace" >> "$GITHUB_ENV"; fi
          echo "SCCACHE_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          echo "SCCACHE_COMPILER_IDENTITY=$clang_identity-sdk-${{ steps.macos-sdk.outputs.identity }}" >> "$GITHUB_ENV"
          echo "SCCACHE_ERROR_LOG=$CI_LOG_DIR/sccache-macos-debug-error.log" >> "$GITHUB_ENV"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.15.0
      - name: Initialize macOS sccache statistics
        run: |
          "$SCCACHE_PATH" --version | tee "$CI_LOG_DIR/sccache-macos-debug-version.txt"
          "$SCCACHE_PATH" --version | grep -F 'sccache 0.15.0'
          "$SCCACHE_PATH" --start-server
          "$SCCACHE_PATH" --zero-stats
      - name: Write macOS compiler-cache initial cache
        run: python3 .github/scripts/write_cmake_compiler_cache_init.py --launcher "$SCCACHE_PATH" --output "$CI_LOG_DIR/cmake-compiler-cache-macos-debug.cmake"
      - name: Configure macOS Debug tests
        id: cmake-configure
        run: |
          current_sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          python3 .github/scripts/run_and_log.py --log "$CI_LOG_DIR/cmake-configure-macos-debug.log" -- cmake -S . -B build/macos-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_SYSROOT="$current_sdk_path" -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-osx -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED" -DVCPKG_MANIFEST_MODE=OFF -DBUILD_TESTING=ON -DPERASTAGE_REQUIRE_SECURE_CREDENTIAL_STORE=ON -DPERASTAGE_ENABLE_COMPILER_CACHE=ON -C "$CI_LOG_DIR/cmake-compiler-cache-macos-debug.cmake"
          test -f build/macos-debug/compile_commands.json || { echo "macOS Debug compile_commands.json was not generated"; exit 1; }
          python3 .github/scripts/validate_cmake_toolchain.py --build-dir build/macos-debug --expected-c-id AppleClang --expected-cxx-id AppleClang --expected-generator Ninja --expected-build-type Debug --expected-launcher "$SCCACHE_PATH"
      - name: Generate macOS CTest inventory
        run: |
          ctest --test-dir build/macos-debug -N -V > "$CI_LOG_DIR/ctest-inventory-macos-debug.txt"
          ctest --test-dir build/macos-debug --show-only=json-v1 > "$CI_LOG_DIR/ctest-inventory-macos-debug.json"
      - name: Build complete macOS test target set
        id: perastage-build
        run: python3 .github/scripts/run_and_log.py --log "$CI_LOG_DIR/build-macos-debug.log" -- cmake --build build/macos-debug --target all --verbose
      - name: Capture macOS sccache statistics
        if: ${{ always() }}
        run: |
          "$SCCACHE_PATH" --show-stats > "$CI_LOG_DIR/sccache-macos-debug.txt"
          "$SCCACHE_PATH" --show-stats --stats-format json > "$CI_LOG_DIR/sccache-macos-debug.json"
          python3 .github/scripts/write_sccache_summary.py --stats-json "$CI_LOG_DIR/sccache-macos-debug.json" --compile-commands build/macos-debug/compile_commands.json --platform macos-debug --architecture "${{ runner.arch }}" --backend "$SCCACHE_BACKEND" --cache-scope "$SCCACHE_CACHE_SCOPE" --scope-reason "$SCCACHE_SCOPE_REASON" --namespace "$SCCACHE_NAMESPACE" --compiler-identity "$SCCACHE_COMPILER_IDENTITY" --base-directory "$SCCACHE_BASEDIRS" --launcher-validation "${{ steps.cmake-configure.outcome == 'success' && 'passed' || 'failed' }}" --build-succeeded "${{ steps.perastage-build.outcome == 'success' }}"
      - name: Run complete macOS CTest suite
        if: ${{ needs.resolve-source.outputs.cache_warming != 'true' }}
        run: |
          set +e
          ctest --test-dir build/macos-debug --output-log "$CI_LOG_DIR/ctest-macos-debug.log" --output-junit "$CI_LOG_DIR/ctest-macos-debug.junit.xml" --output-on-failure --verbose
          ctest_exit=$?
          python3 .github/scripts/summarize_ctest_failures.py --platform macos --junit "$CI_LOG_DIR/ctest-macos-debug.junit.xml" --log "$CI_LOG_DIR/ctest-macos-debug.log" --last-tests-failed build/macos-debug/Testing/Temporary/LastTestsFailed.log --output "$CI_LOG_DIR/ctest-macos-debug-failures.csv"
          python3 .github/scripts/summarize_ctest_results.py --platform macos --junit "$CI_LOG_DIR/ctest-macos-debug.junit.xml" --output "$CI_LOG_DIR/ctest-macos-debug-results.json" --tested-sha "${{ needs.resolve-source.outputs.source_sha }}" --profile "$PERASTAGE_CI_PROFILE"
          exit $ctest_exit
      - name: Upload macOS test results
        if: ${{ always() && needs.resolve-source.outputs.cache_warming != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-macos-debug-test-results
          if-no-files-found: ignore
          path: |
            out/ci-logs/ctest-inventory-macos-debug.*
            out/ci-logs/sccache-macos-debug*
            out/ci-logs/ctest-macos-debug.junit.xml
            out/ci-logs/ctest-macos-debug*.log
            out/ci-logs/ctest-macos-debug-failures.csv
            out/ci-logs/ctest-macos-debug-results.json
            build/macos-debug/Testing/Temporary/LastTestsFailed.log
            build/macos-debug/Testing/Temporary/LastTestsDisabled.log
      - name: Upload failure diagnostics
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-macos-debug-diagnostics
          if-no-files-found: ignore
          path: |
            out/ci-logs/**
            **/CMakeFiles/CMakeConfigureLog.yaml
            **/CMakeCache.txt
            build/**/*.log
            build/**/Testing/Temporary/**
            vcpkg/buildtrees/**/*.log
            vcpkg/buildtrees/**/config-*.txt
            vcpkg/buildtrees/**/issue_body.md
            .vcpkg-cache/installed/vcpkg/issue_body.md
