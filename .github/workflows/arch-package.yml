# Arch Linux package workflow for Perastage.
# Builds an experimental pacman package without changing the AppImage workflow.

name: Arch Linux Release Package

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to build from when called as a reusable workflow.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional git ref to build from.
        required: false
        type: string
        default: ""
  push:
    branches:
      - ci/arch-package

jobs:
  build-arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED: ${{ github.workspace }}/.vcpkg-cache/installed
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-cache/downloads
      VCPKG_PACKAGES: ${{ github.workspace }}/.vcpkg-cache/packages
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache/binary
      CI_LOG_DIR: ${{ github.workspace }}/out/ci-logs
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache/binary,readwrite
      VCPKG_CACHE_SCHEMA: securestore-v2
      VCPKG_TARGET_TRIPLET: x64-linux

    steps:
      - name: Prepare Arch base tools
        run: |
          pacman -Syu --noconfirm --needed git ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.ref }}

      - name: Prepare CI log directory
        shell: bash
        run: mkdir -p "$CI_LOG_DIR"

      - name: Read vcpkg baseline
        id: vcpkg-baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(python3 .github/scripts/get_vcpkg_baseline.py vcpkg.json)"
          echo "baseline=${baseline}" >> "$GITHUB_OUTPUT"
          echo "VCPKG_BASELINE=${baseline}" >> "$GITHUB_ENV"

      - name: Install Arch build dependencies
        run: |
          pacman -S --noconfirm --needed \
            autoconf \
            autoconf-archive \
            automake \
            cmake \
            curl \
            desktop-file-utils \
            file \
            gcc \
            gettext \
            glew \
            glu \
            gtk3 \
            hicolor-icon-theme \
            libglvnd \
            libtool \
            m4 \
            make \
            ninja \
            patch \
            pkgconf \
            shared-mime-info \
            tar \
            unzip \
            zip \
            zlib \
            libsecret

      - name: Verify autotools for vcpkg
        run: |
          set -euo pipefail
          pacman -Q autoconf autoconf-archive automake libtool gettext
          command -v autoconf
          command -v autoreconf
          command -v aclocal
          command -v automake
          command -v libtoolize
          command -v autopoint

      - name: Restore vcpkg downloads
        id: vcpkg-downloads-cache
        uses: actions/cache/restore@v5
        with:
          path: .vcpkg-cache/downloads
          key: ${{ runner.os }}-${{ runner.arch }}-arch-vcpkg-downloads-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-arch-vcpkg-downloads-${{ steps.vcpkg-baseline.outputs.baseline }}-
            ${{ runner.os }}-${{ runner.arch }}-arch-vcpkg-downloads-

      - name: Cache vcpkg installed packages and binary archives
        uses: actions/cache@v5
        with:
          path: |
            .vcpkg-cache/installed
            .vcpkg-cache/packages
            .vcpkg-cache/binary
          key: ${{ runner.os }}-${{ runner.arch }}-arch-vcpkg-installed-${{ steps.vcpkg-baseline.outputs.baseline }}-x64-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Prepare vcpkg folders
        run: |
          mkdir -p "$VCPKG_DOWNLOADS" "$VCPKG_INSTALLED" "$VCPKG_PACKAGES"

      - name: Bootstrap vcpkg
        run: |
          if [ -d "$VCPKG_ROOT/.git" ]; then
            git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_BASELINE"
            git -C "$VCPKG_ROOT" checkout --force "$VCPKG_BASELINE"
          else
            rm -rf "$VCPKG_ROOT"
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            git -C "$VCPKG_ROOT" checkout --force "$VCPKG_BASELINE"
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install vcpkg packages
        run: |
          set -euo pipefail
          rm -rf "$VCPKG_PACKAGES"/gperf_* "$VCPKG_INSTALLED"/vcpkg/issue_body.md
          # Perastage still uses vcpkg for Linux CI because nanovg, PoDoFo, and
          # meshoptimizer availability can vary across distro repositories.
          python3 .github/scripts/vcpkg_install_retry.py --vcpkg "$VCPKG_ROOT/vcpkg" --triplet x64-linux --manifest-root "$GITHUB_WORKSPACE" \
            --install-root "$VCPKG_INSTALLED" \
            --packages-root "$VCPKG_PACKAGES" \
            --downloads-root "$VCPKG_DOWNLOADS" \
            --attempts 4 --initial-delay-seconds 30 --max-delay-seconds 120 \
            --log "$CI_LOG_DIR/vcpkg-install-x64-linux.log"
      - name: Save vcpkg downloads cache
        if: ${{ always() && steps.vcpkg-downloads-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .vcpkg-cache/downloads
          key: ${{ steps.vcpkg-downloads-cache.outputs.cache-primary-key }}

      - name: Create makepkg user
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Arch package
        run: |
          su builder -c "export VCPKG_ROOT='$VCPKG_ROOT' VCPKG_INSTALLED='$VCPKG_INSTALLED' VCPKG_TARGET_TRIPLET='$VCPKG_TARGET_TRIPLET' PERASTAGE_REQUIRE_SECURE_CREDENTIAL_STORE=ON PERASTAGE_ENABLE_COMPILER_CACHE=OFF; cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --force --noconfirm --nodeps"

      - name: Collect Arch package
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be MAJOR.MINOR.PATCH, got: '$VERSION'"
            exit 1
          fi

          mapfile -t PACKAGE_FILES < <(find packaging/arch -maxdepth 1 -type f -name 'perastage-*-x86_64.pkg.tar.zst' ! -name 'perastage-debug-*.pkg.tar.zst' | sort)
          if [ "${#PACKAGE_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one main Arch package, found ${#PACKAGE_FILES[@]}"
            printf '%s\n' "${PACKAGE_FILES[@]:-none}"
            echo "All generated Arch packages:"
            find packaging/arch -maxdepth 1 -type f -name '*.pkg.tar.zst' | sort
            exit 1
          fi

          OUTPUT_NAME="Perastage-${VERSION}-arch-x86_64.pkg.tar.zst"
          cp "${PACKAGE_FILES[0]}" "$OUTPUT_NAME"
          test -f "$OUTPUT_NAME" || { echo "Arch package was not created"; exit 1; }
          file "$OUTPUT_NAME"
          tar -tf "$OUTPUT_NAME" | tee arch-package-contents.txt
          grep -q '^opt/perastage/Perastage$' arch-package-contents.txt
          grep -q '^opt/perastage/resources/' arch-package-contents.txt
          for lang in es zh_CN; do
            grep -q "^opt/perastage/resources/locale/${lang}/LC_MESSAGES/perastage.mo$" arch-package-contents.txt || { echo "Missing Arch package catalog for ${lang}"; exit 1; }
          done
          grep -q '^opt/perastage/library/' arch-package-contents.txt
          grep -q '^opt/perastage/licenses/' arch-package-contents.txt
          grep -q '^opt/perastage/help.md$' arch-package-contents.txt
          grep -q '^usr/share/applications/perastage.desktop$' arch-package-contents.txt
          grep -q '^usr/share/mime/packages/perastage-mime.xml$' arch-package-contents.txt
          grep -q '^usr/share/icons/hicolor/1024x1024/apps/perastage.png$' arch-package-contents.txt

      - name: Collect Arch Linux symbols
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SYMBOLS_DIR="out/symbols/archlinux"
          rm -rf "$SYMBOLS_DIR"
          mkdir -p "$SYMBOLS_DIR"
          mapfile -t DEBUG_PACKAGES < <(find packaging/arch -maxdepth 1 -type f -name 'perastage-debug-*.pkg.tar.zst' | sort)
          if [ "${#DEBUG_PACKAGES[@]}" -lt 1 ]; then
            echo "Arch debug package was not generated"
            find packaging/arch -maxdepth 1 -type f -name '*.pkg.tar.zst' | sort
            exit 1
          fi
          cp "${DEBUG_PACKAGES[0]}" "$SYMBOLS_DIR/"
          (cd "$SYMBOLS_DIR" && zip -r "../../Perastage-$VERSION-ArchLinux-symbols.zip" .)
          test -f "out/Perastage-$VERSION-ArchLinux-symbols.zip"

      - name: Upload Arch Linux symbols
        uses: actions/upload-artifact@v7
        with:
          name: Perastage-archlinux-symbols
          path: out/Perastage-*-ArchLinux-symbols.zip

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v7
        with:
          name: Perastage-arch-package
          path: Perastage-*-arch-x86_64.pkg.tar.zst

      - name: Upload final CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: arch-package-diagnostics
          if-no-files-found: ignore
          path: |
            out/ci-logs/**
            **/CMakeFiles/CMakeConfigureLog.yaml
            **/CMakeCache.txt
            **/CMakeFiles/CMakeOutput.log
            **/CMakeFiles/CMakeError.log
            build/**/*.log
            build-*/**/*.log
            vcpkg/buildtrees/**/*.log
            vcpkg/buildtrees/**/config-*.txt
            vcpkg/buildtrees/**/issue_body.md
            .vcpkg-cache/installed/vcpkg/issue_body.md
