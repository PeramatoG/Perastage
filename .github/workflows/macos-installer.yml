# macOS installer workflow for Perastage
# Builds and stages the macOS application using vcpkg and CMake.

name: macOS Installer Build

on:
  workflow_dispatch:
  push:
    branches:
      - ci/macos-installer

jobs:
  build-macos-installer:
    runs-on: macos-latest

    env:
      # Single source of truth for all vcpkg paths used across steps.
      VCPKG_ROOT:        ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED:   ${{ github.workspace }}/.vcpkg-cache/installed
      VCPKG_DOWNLOADS:   ${{ github.workspace }}/.vcpkg-cache/downloads
      VCPKG_PACKAGES:    ${{ github.workspace }}/.vcpkg-cache/packages
      VCPKG_TRIPLET:     arm64-osx

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install macOS build tools ────────────────────────────────────────
      - name: Install macOS build tools
        run: |
          brew update
          brew install autoconf autoconf-archive automake libtool

      # ── 3. Cache vcpkg installed tree + downloads ───────────────────────────
      - name: Cache vcpkg
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: |
            .vcpkg-cache/downloads
            .vcpkg-cache/installed
            .vcpkg-cache/packages
          key: ${{ runner.os }}-vcpkg-arm64-osx-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/workflows/macos-installer.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-arm64-osx-
            ${{ runner.os }}-vcpkg-

      # ── 4. Prepare vcpkg cache folders ──────────────────────────────────────
      # These folders must exist before bootstrap because VCPKG_DOWNLOADS is
      # already visible to vcpkg during bootstrap.
      - name: Prepare vcpkg folders
        run: |
          mkdir -p "$VCPKG_DOWNLOADS"
          mkdir -p "$VCPKG_INSTALLED"
          mkdir -p "$VCPKG_PACKAGES"

      # ── 5. Bootstrap vcpkg ──────────────────────────────────────────────────
      - name: Bootstrap vcpkg
        run: |
          if [ -d "$VCPKG_ROOT/.git" ]; then
            echo "Updating existing vcpkg checkout..."
            git -C "$VCPKG_ROOT" fetch --depth 1 origin master
            git -C "$VCPKG_ROOT" checkout --force FETCH_HEAD
          else
            rm -rf "$VCPKG_ROOT"
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi

          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # ── 6. Install vcpkg packages ───────────────────────────────────────────
      - name: Install vcpkg packages
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            wxwidgets:$VCPKG_TRIPLET \
            tinyxml2:$VCPKG_TRIPLET \
            glew:$VCPKG_TRIPLET \
            curl:$VCPKG_TRIPLET \
            zlib:$VCPKG_TRIPLET \
            nanovg:$VCPKG_TRIPLET \
            podofo:$VCPKG_TRIPLET \
            meshoptimizer:$VCPKG_TRIPLET \
            --x-install-root="$VCPKG_INSTALLED" \
            --x-packages-root="$VCPKG_PACKAGES" \
            --downloads-root="$VCPKG_DOWNLOADS"

      # ── 7. Configure CMake ──────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPERAVIZ_ENABLE_NATIVE=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED"

      # ── 8. Build project ────────────────────────────────────────────────────
      - name: Build project
        run: |
          cmake --build build --config Release --parallel

      # ── 9. Stage distribution folder ────────────────────────────────────────
      - name: Stage distribution folder
        run: |
          cmake --build build --config Release --target perastage_stage
          find out/install/Release -maxdepth 4 -print || true

      # ── 10. Upload staged build ─────────────────────────────────────────────
      - name: Upload staged distribution
        uses: actions/upload-artifact@v4
        with:
          name: Perastage-macos-staged
          path: out/install/Release
