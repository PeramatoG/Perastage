# Linux installer workflow for Perastage
# Builds, stages, and packages the Linux AppImage using vcpkg and CMake.

name: Linux Ubuntu Installer Build

on:
  workflow_dispatch:
  push:
    branches:
      - ci/linux-appimage

jobs:
  build-linux-appimage:
    runs-on: ubuntu-latest

    env:
      # Single source of truth for all vcpkg paths used across steps.
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED: ${{ github.workspace }}/.vcpkg-cache/installed
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-cache/downloads
      VCPKG_PACKAGES: ${{ github.workspace }}/.vcpkg-cache/packages

    steps:
      # 1. Checkout repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Linux build dependencies.
      # Keep comments outside the apt continuation block to avoid breaking Bash.
      - name: Install Linux build dependencies
        run: |
          # Install system packages required by vcpkg Linux ports and AppImage packaging.
          # Wayland and EGL development packages are intentionally omitted so wxWidgets and GLEW stay on the X11/GLX path.
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libltdl-dev \
            gettext \
            autopoint \
            m4 \
            curl \
            unzip \
            zip \
            patchelf \
            libx11-dev \
            libxau-dev \
            libxdmcp-dev \
            x11proto-dev \
            libxi-dev \
            libxtst-dev \
            libxrender-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgpg-error0 \
            libgcrypt20 \
            imagemagick \
            file \
            desktop-file-utils \
            shared-mime-info \
            libglib2.0-bin \
            librsvg2-dev \
            gobject-introspection \
            libgirepository1.0-dev

      # 3. Cache vcpkg downloads, installed packages, and package build trees.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-cache/downloads
            .vcpkg-cache/installed
            .vcpkg-cache/packages
          key: ${{ runner.os }}-vcpkg-x64-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/workflows/linux-installer.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-x64-linux-
            ${{ runner.os }}-vcpkg-

      # 4. Create vcpkg cache directories before bootstrap and install.
      - name: Prepare vcpkg folders
        run: |
          mkdir -p "$VCPKG_DOWNLOADS" "$VCPKG_INSTALLED" "$VCPKG_PACKAGES"

      # 5. Clone or update vcpkg and bootstrap it.
      - name: Bootstrap vcpkg
        run: |
          if [ -d "$VCPKG_ROOT/.git" ]; then
            git -C "$VCPKG_ROOT" fetch --depth 1 origin master
            git -C "$VCPKG_ROOT" checkout --force FETCH_HEAD
          else
            rm -rf "$VCPKG_ROOT"
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # 6. Install the dependencies required by Perastage.
      - name: Install vcpkg packages
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            wxwidgets:x64-linux \
            tinyxml2:x64-linux \
            glew:x64-linux \
            curl:x64-linux \
            zlib:x64-linux \
            nanovg:x64-linux \
            podofo:x64-linux \
            meshoptimizer:x64-linux \
            --x-install-root="$VCPKG_INSTALLED" \
            --x-packages-root="$VCPKG_PACKAGES" \
            --downloads-root="$VCPKG_DOWNLOADS"

      # 7. Configure CMake with the Linux preset and the CI vcpkg toolchain.
      - name: Configure CMake
        run: |
          cmake --preset wsl-x64-release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED"

      # 8. Build the existing staging target used for packaging.
      - name: Build staged distribution
        run: |
          cmake --build --preset wsl-release-stage
          test -f out/install/Release/Perastage || { echo "Missing staged executable: out/install/Release/Perastage"; exit 1; }
          test -x out/install/Release/Perastage || { echo "Staged executable is not executable"; exit 1; }

      # 9. Upload the staged folder for diagnostics.
      - name: Upload staged distribution
        uses: actions/upload-artifact@v4
        with:
          name: Perastage-linux-staged
          path: out/install/Release

      # 10. Build the AppDir and create the final AppImage.
      - name: Build AppDir and AppImage
        run: |
          set -euo pipefail

          APPDIR="Perastage.AppDir"
          STAGE_DIR="out/install/Release"

          VERSION="$(sed -nE 's/^project\(Perastage VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Failed to extract project version from CMakeLists.txt"
            exit 1
          fi

          test -f "$STAGE_DIR/Perastage" || { echo "Missing staged executable: $STAGE_DIR/Perastage"; exit 1; }
          test -d "$STAGE_DIR/resources" || { echo "Missing staged resources directory"; exit 1; }
          test -d "$STAGE_DIR/library" || { echo "Missing staged library directory"; exit 1; }
          test -d "$STAGE_DIR/licenses" || { echo "Missing staged licenses directory"; exit 1; }
          test -f "resources/Perastage_logo_1024.png" || { echo "Missing icon: resources/Perastage_logo_1024.png"; exit 1; }
          test -f "packaging/linux/perastage-mime.xml" || { echo "Missing MIME metadata file"; exit 1; }

          # Downscale the 1024x1024 icon to 512x512 to satisfy linuxdeploy requirements.
          convert resources/Perastage_logo_1024.png -resize 512x512 Perastage_logo_512.png

          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$APPDIR/usr/share/mime/packages"

          cp "$STAGE_DIR/Perastage" "$APPDIR/usr/bin/Perastage"
          cp -a "$STAGE_DIR/resources" "$APPDIR/usr/bin/"
          cp -a "$STAGE_DIR/library" "$APPDIR/usr/bin/"
          cp -a "$STAGE_DIR/licenses" "$APPDIR/usr/bin/"
          if [ -d "$STAGE_DIR/docs" ]; then
            cp -a "$STAGE_DIR/docs" "$APPDIR/usr/bin/"
          fi

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -e' \
            '' \
            'APPDIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            'PIXBUF_DIR="$APPDIR/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders"' \
            'PIXBUF_CACHE="$APPDIR/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"' \
            'RUNTIME_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/perastage"' \
            'RUNTIME_PIXBUF_CACHE="$RUNTIME_CACHE_DIR/gdk-pixbuf-loaders.cache"' \
            '' \
            'export GDK_BACKEND=x11' \
            'export QT_QPA_PLATFORM=xcb' \
            'export LD_LIBRARY_PATH="$APPDIR/usr/lib:$APPDIR/usr/bin:${LD_LIBRARY_PATH:-}"' \
            '' \
            '# Force gdk-pixbuf to use the bundled loaders. Some linuxdeploy GTK cache entries are relative paths,' \
            '# and they can resolve incorrectly once AppRun changes the working directory.' \
            'if [ -d "$PIXBUF_DIR" ]; then' \
            '  export GDK_PIXBUF_MODULEDIR="$PIXBUF_DIR"' \
            '  if [ -f "$PIXBUF_CACHE" ]; then' \
            '    mkdir -p "$RUNTIME_CACHE_DIR"' \
            '    sed -E "s#\"([^\"]*/)?libpixbufloader-#\"$PIXBUF_DIR/libpixbufloader-#g; s#\"\.\./libpixbufloader-#\"$PIXBUF_DIR/libpixbufloader-#g" "$PIXBUF_CACHE" > "$RUNTIME_PIXBUF_CACHE"' \
            '    export GDK_PIXBUF_MODULE_FILE="$RUNTIME_PIXBUF_CACHE"' \
            '  fi' \
            'fi' \
            '' \
            'cd "$APPDIR/usr/bin"' \
            'exec "$APPDIR/usr/bin/Perastage" "$@"' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Version=1.0' \
            'Name=Perastage' \
            'Comment=Lighting plot editor and MVR viewer' \
            'Exec=Perastage %f' \
            'Icon=Perastage' \
            'Terminal=false' \
            'Categories=Graphics;Utility;' \
            'MimeType=application/x-perastage-mvr;application/x-perastage-project;' \
            'StartupNotify=true' > "$APPDIR/Perastage.desktop"

          cp "$APPDIR/Perastage.desktop" "$APPDIR/usr/share/applications/Perastage.desktop"
          cp Perastage_logo_512.png "$APPDIR/Perastage.png"
          cp Perastage_logo_512.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/Perastage.png"
          cp packaging/linux/perastage-mime.xml "$APPDIR/usr/share/mime/packages/perastage-mime.xml"

          # Bundle runtime libraries that linuxdeploy does not bundle automatically.
          mkdir -p "$APPDIR/usr/lib"
          for LIB_NAME in libgpg-error.so.0 libgcrypt.so.20; do
            LIB_PATH="$(ldconfig -p | awk -v name="$LIB_NAME" '$1 == name { print $NF; exit }')"
            if [ -z "$LIB_PATH" ]; then
              echo "Missing runtime library on runner: $LIB_NAME"
              exit 1
            fi
            cp -L "$LIB_PATH" "$APPDIR/usr/lib/$LIB_NAME"
          done

          # Verify the required runtime libraries were bundled.
          test -f "$APPDIR/usr/lib/libgpg-error.so.0" || { echo "Missing bundled libgpg-error.so.0"; exit 1; }
          test -f "$APPDIR/usr/lib/libgcrypt.so.20" || { echo "Missing bundled libgcrypt.so.20"; exit 1; }

          test -f "$APPDIR/AppRun" || { echo "Missing AppRun"; exit 1; }
          test -x "$APPDIR/AppRun" || { echo "AppRun is not executable"; exit 1; }
          test -f "$APPDIR/Perastage.desktop" || { echo "Missing root desktop file"; exit 1; }
          test -f "$APPDIR/Perastage.png" || { echo "Missing root icon"; exit 1; }
          test -f "$APPDIR/usr/bin/Perastage" || { echo "Missing bundled executable"; exit 1; }
          test -f "$APPDIR/usr/share/mime/packages/perastage-mime.xml" || { echo "Missing bundled MIME metadata"; exit 1; }
          grep -q '^Exec=Perastage %f$' "$APPDIR/Perastage.desktop" || { echo "Desktop Exec entry is invalid"; exit 1; }
          grep -q '^Icon=Perastage$' "$APPDIR/Perastage.desktop" || { echo "Desktop Icon entry is invalid"; exit 1; }

          download_checked() {
            local url="$1"
            local output="$2"
            curl -fL --retry 3 --retry-delay 2 -o "$output" "$url"
            test -s "$output" || { echo "Downloaded file is empty: $output"; exit 1; }
            if [ "$(wc -c < "$output")" -lt 1024 ]; then
              echo "Downloaded file is unexpectedly small: $output"
              echo "URL: $url"
              echo "File contents:"
              cat "$output"
              exit 1
            fi
          }

          download_checked \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # The GTK plugin repository does not publish GitHub release assets.
          # Download the script from the official repository instead of /releases/latest/.
          download_checked \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh \
            linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-plugin-gtk.sh

          download_checked \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          echo "linuxdeploy information:"
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --version || true
          echo "GTK plugin information:"
          DEPLOY_GTK_VERSION=3 ./linuxdeploy-plugin-gtk.sh --plugin-api-version

          export ARCH=x86_64
          export DEPLOY_GTK_VERSION=3

          # Extract appimagetool with the AppImage runtime option only.
          # Do not combine this with --appimage-extract-and-run, because that forwards
          # --appimage-extract to appimagetool itself instead of extracting the AppImage.
          rm -rf squashfs-root appimagetool-root
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root appimagetool-root

          APPIMAGE_EXTRACT_AND_RUN=1 DEPLOY_GTK_VERSION=3 ./linuxdeploy-x86_64.AppImage \
            --appdir "$APPDIR" \
            --plugin gtk \
            --desktop-file "$APPDIR/Perastage.desktop" \
            --icon-file "$APPDIR/Perastage.png"

          APPIMAGE_NAME="Perastage-${VERSION}-x86_64.AppImage"
          ./appimagetool-root/AppRun "$APPDIR" "$APPIMAGE_NAME"

          test -f "$APPIMAGE_NAME" || { echo "AppImage was not created"; exit 1; }
          test -x "$APPIMAGE_NAME" || { echo "AppImage is not executable"; exit 1; }

          rm -rf squashfs-root
          unset APPIMAGE_EXTRACT_AND_RUN || true
          ./$APPIMAGE_NAME --appimage-extract

          test -f squashfs-root/AppRun || { echo "Extracted AppRun is missing"; exit 1; }
          test -x squashfs-root/AppRun || { echo "Extracted AppRun is not executable"; exit 1; }
          test -f squashfs-root/Perastage.desktop || { echo "Extracted desktop file is missing"; exit 1; }
          test -f squashfs-root/Perastage.png || { echo "Extracted icon is missing"; exit 1; }
          test -f squashfs-root/usr/bin/Perastage || { echo "Extracted executable is missing"; exit 1; }
          test -f squashfs-root/usr/share/mime/packages/perastage-mime.xml || { echo "Extracted MIME metadata is missing"; exit 1; }
          grep -q 'application/x-perastage-mvr' squashfs-root/usr/share/mime/packages/perastage-mime.xml || { echo "MIME type for .mvr is missing"; exit 1; }
          grep -q 'application/x-perastage-project' squashfs-root/usr/share/mime/packages/perastage-mime.xml || { echo "MIME type for .pstg is missing"; exit 1; }

          # Ensure the required runtime libraries are present in the extracted AppImage.
          test -f squashfs-root/usr/lib/libgpg-error.so.0 || { echo "Extracted libgpg-error.so.0 is missing"; exit 1; }
          test -f squashfs-root/usr/lib/libgcrypt.so.20 || { echo "Extracted libgcrypt.so.20 is missing"; exit 1; }
          test -f squashfs-root/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders/libpixbufloader-svg.so || { echo "Extracted gdk-pixbuf SVG loader is missing"; exit 1; }
          test -f squashfs-root/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache || { echo "Extracted gdk-pixbuf loaders.cache is missing"; exit 1; }

      # 11. Upload the final AppImage artifact.
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perastage-linux-appimage
          path: Perastage-*-x86_64.AppImage
