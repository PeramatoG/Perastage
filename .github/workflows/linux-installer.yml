# Linux installer workflow for Perastage
# Builds, stages, and packages the Linux AppImage using vcpkg and CMake.

name: Linux Ubuntu Release AppImage

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to build from when called as a reusable workflow.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional git ref to build from.
        required: false
        type: string
        default: ""
  push:
    branches:
      - ci/linux-appimage

permissions:
  contents: read
  packages: read

jobs:
  build-linux-appimage:
    runs-on: ubuntu-latest

    env:
      # Single source of truth for all vcpkg paths used across steps.
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED: ${{ github.workspace }}/.vcpkg-cache/installed
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-cache/downloads
      VCPKG_CACHE_SCHEMA: securestore-v2
      VCPKG_PACKAGES: ${{ github.workspace }}/.vcpkg-cache/packages
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache/binary
      CI_LOG_DIR: ${{ github.workspace }}/out/ci-logs
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache/binary,readwrite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.ref }}

      - name: Prepare CI log directory
        shell: bash
        run: mkdir -p "$CI_LOG_DIR"

      - name: Read vcpkg baseline
        id: vcpkg-baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(python3 .github/scripts/get_vcpkg_baseline.py vcpkg.json)"
          echo "baseline=${baseline}" >> "$GITHUB_OUTPUT"
          echo "VCPKG_BASELINE=${baseline}" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mono-complete \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libltdl-dev \
            gettext \
            autopoint \
            m4 \
            curl \
            unzip \
            zip \
            patchelf \
            libx11-dev \
            libxau-dev \
            libxdmcp-dev \
            x11proto-dev \
            libxi-dev \
            libxtst-dev \
            libxrender-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libsecret-1-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgpg-error0 \
            libgcrypt20 \
            imagemagick \
            file \
            desktop-file-utils \
            shared-mime-info \
            libglib2.0-bin

      - name: Restore vcpkg downloads
        id: vcpkg-downloads-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .vcpkg-cache/downloads
          key: vcpkg-downloads-v3-${{ runner.os }}-${{ runner.arch }}-x64-linux-default-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-downloads-v3-${{ runner.os }}-${{ runner.arch }}-x64-linux-default-${{ steps.vcpkg-baseline.outputs.baseline }}-

      - name: Restore vcpkg installed packages and binary archives
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .vcpkg-cache/installed
            .vcpkg-cache/packages
            .vcpkg-cache/binary
          key: vcpkg-compiled-v3-${{ runner.os }}-${{ runner.arch }}-x64-linux-default-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-compiled-v3-${{ runner.os }}-${{ runner.arch }}-x64-linux-default-${{ steps.vcpkg-baseline.outputs.baseline }}-

      - name: Prepare vcpkg folders
        run: |
          mkdir -p "$VCPKG_DOWNLOADS" "$VCPKG_INSTALLED" "$VCPKG_PACKAGES" "$VCPKG_BINARY_CACHE"

      - name: Bootstrap vcpkg
        run: |
          if [ -d "$VCPKG_ROOT/.git" ]; then
            git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_BASELINE"
            git -C "$VCPKG_ROOT" checkout --force "$VCPKG_BASELINE"
          else
            rm -rf "$VCPKG_ROOT"
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            git -C "$VCPKG_ROOT" checkout --force "$VCPKG_BASELINE"
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Ensure Mono is available for NuGet
        shell: bash
        run: mono --version

      - name: Configure GitHub Packages binary cache
        id: vcpkg-remote-cache
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/setup_vcpkg_github_packages.py --vcpkg "$VCPKG_ROOT/vcpkg" --local-cache "$VCPKG_BINARY_CACHE" --mode read

      - name: Install vcpkg packages
        run: |
          python3 .github/scripts/vcpkg_install_retry.py --vcpkg "$VCPKG_ROOT/vcpkg" --triplet x64-linux --manifest-root "$GITHUB_WORKSPACE" \
            --install-root "$VCPKG_INSTALLED" \
            --packages-root "$VCPKG_PACKAGES" \
            --downloads-root "$VCPKG_DOWNLOADS" \
            --attempts 4 --initial-delay-seconds 30 --max-delay-seconds 120 \
            --log "$CI_LOG_DIR/vcpkg-install-x64-linux.log"
      - name: Save vcpkg downloads cache
        if: ${{ steps.vcpkg-downloads-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .vcpkg-cache/downloads
          key: ${{ steps.vcpkg-downloads-cache.outputs.cache-primary-key }}
      - name: Save vcpkg installed packages and binary archives
        id: vcpkg-cache-save
        if: ${{ steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .vcpkg-cache/installed
            .vcpkg-cache/packages
            .vcpkg-cache/binary
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Summarize vcpkg cache behavior
        if: ${{ always() }}
        run: |
          python3 .github/scripts/write_vcpkg_cache_summary.py --platform linux --triplet x64-linux --baseline "${{ steps.vcpkg-baseline.outputs.baseline }}" --schema v3 --primary-key "${{ steps.vcpkg-cache.outputs.cache-primary-key }}" --downloads-hit "${{ steps.vcpkg-downloads-cache.outputs.cache-hit }}" --compiled-hit "${{ steps.vcpkg-cache.outputs.cache-hit }}" --compiled-save-outcome "${{ steps.vcpkg-cache-save.outcome }}" --remote-mode read --remote-enabled "${{ steps.vcpkg-remote-cache.outputs.remote-enabled }}" --remote-setup-result "${{ steps.vcpkg-remote-cache.outputs.setup-result }}" --fallback-local-only "${{ steps.vcpkg-remote-cache.outputs.fallback-local-only }}" --publish-permitted no --publication-verification not-applicable


      - name: Configure CMake
        run: |
          python3 .github/scripts/run_and_log.py --log "$CI_LOG_DIR/cmake-configure-linux.log" -- \
            cmake --preset wsl-x64-release \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -g" \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x64-linux \
              -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED" \
              -DVCPKG_MANIFEST_MODE=OFF \
              -DPERASTAGE_REQUIRE_SECURE_CREDENTIAL_STORE=ON \
              -DPERASTAGE_ENABLE_COMPILER_CACHE=OFF \
              -DBUILD_TESTING=OFF


      - name: Build staged distribution
        run: |
          cmake --build --preset wsl-release-stage

          STAGE_DIR="out/install/Release"
          test -f "$STAGE_DIR/Perastage" || { echo "Missing staged executable: $STAGE_DIR/Perastage"; exit 1; }
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SYMBOLS_DIR="out/symbols/linux"
          rm -rf "$SYMBOLS_DIR"
          mkdir -p "$SYMBOLS_DIR"
          objcopy --only-keep-debug "$STAGE_DIR/Perastage" "$SYMBOLS_DIR/Perastage.debug"
          strip --strip-debug "$STAGE_DIR/Perastage"
          objcopy --add-gnu-debuglink="$SYMBOLS_DIR/Perastage.debug" "$STAGE_DIR/Perastage"
          (cd "$SYMBOLS_DIR" && zip -r "../../Perastage-$VERSION-Linux-symbols.zip" .)
          test -f "out/Perastage-$VERSION-Linux-symbols.zip" || { echo "Linux symbols ZIP was not created"; exit 1; }
          test -x "$STAGE_DIR/Perastage" || { echo "Staged executable is not executable"; exit 1; }
          test -d "$STAGE_DIR/resources" || { echo "Missing staged resources directory"; exit 1; }
          for lang in es zh_CN; do
            test -f "$STAGE_DIR/resources/locale/${lang}/LC_MESSAGES/perastage.mo" || { echo "Missing staged ${lang} catalog"; exit 1; }
          done
          test -d "$STAGE_DIR/library" || { echo "Missing staged library directory"; exit 1; }
          test -d "$STAGE_DIR/licenses" || { echo "Missing staged licenses directory"; exit 1; }
          ls -la "$STAGE_DIR"

      - name: Upload Linux symbols
        uses: actions/upload-artifact@v7
        with:
          name: Perastage-linux-symbols
          path: out/Perastage-*-Linux-symbols.zip

      - name: Upload staged distribution
        uses: actions/upload-artifact@v7
        with:
          name: Perastage-linux-staged
          path: out/install/Release

      - name: Build AppDir and AppImage
        run: |
          set -euo pipefail

          APPDIR="Perastage.AppDir"
          STAGE_DIR="out/install/Release"

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be MAJOR.MINOR.PATCH, got: '$VERSION'"
            exit 1
          fi

          test -f "$STAGE_DIR/Perastage" || { echo "Missing staged executable: $STAGE_DIR/Perastage"; exit 1; }
          test -d "$STAGE_DIR/resources" || { echo "Missing staged resources directory"; exit 1; }
          for lang in es zh_CN; do
            test -f "$STAGE_DIR/resources/locale/${lang}/LC_MESSAGES/perastage.mo" || { echo "Missing staged ${lang} catalog"; exit 1; }
          done
          test -d "$STAGE_DIR/library" || { echo "Missing staged library directory"; exit 1; }
          test -d "$STAGE_DIR/licenses" || { echo "Missing staged licenses directory"; exit 1; }
          test -f "resources/Perastage_logo_1024.png" || { echo "Missing icon: resources/Perastage_logo_1024.png"; exit 1; }
          test -f "packaging/linux/perastage-mime.xml" || { echo "Missing MIME metadata file"; exit 1; }

          convert resources/Perastage_logo_1024.png -resize 512x512 Perastage_logo_512.png

          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$APPDIR/usr/share/mime/packages"

          cp "$STAGE_DIR/Perastage" "$APPDIR/usr/bin/Perastage"
          cp -a "$STAGE_DIR/resources" "$APPDIR/usr/bin/"
          cp -a "$STAGE_DIR/library" "$APPDIR/usr/bin/"
          cp -a "$STAGE_DIR/licenses" "$APPDIR/usr/bin/"
          if [ -d "$STAGE_DIR/docs" ]; then
            cp -a "$STAGE_DIR/docs" "$APPDIR/usr/bin/"
          fi

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -e' \
            '' \
            'APPDIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            'export GDK_BACKEND=x11' \
            'export QT_QPA_PLATFORM=xcb' \
            'export LD_LIBRARY_PATH="$APPDIR/usr/lib:$APPDIR/usr/bin:${LD_LIBRARY_PATH:-}"' \
            'cd "$APPDIR/usr/bin"' \
            'exec "$APPDIR/usr/bin/Perastage" "$@"' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Version=1.0' \
            'Name=Perastage' \
            'Comment=Lighting plot editor and MVR viewer' \
            'Exec=Perastage %f' \
            'Icon=Perastage' \
            'Terminal=false' \
            'Categories=Graphics;Utility;' \
            'MimeType=application/x-perastage-mvr;application/x-perastage-project;' \
            'StartupNotify=true' > "$APPDIR/Perastage.desktop"

          cp "$APPDIR/Perastage.desktop" "$APPDIR/usr/share/applications/Perastage.desktop"
          cp Perastage_logo_512.png "$APPDIR/Perastage.png"
          cp Perastage_logo_512.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/Perastage.png"
          cp packaging/linux/perastage-mime.xml "$APPDIR/usr/share/mime/packages/perastage-mime.xml"

          mkdir -p "$APPDIR/usr/lib"
          for LIB_NAME in libgpg-error.so.0 libgcrypt.so.20; do
            LIB_PATH="$(ldconfig -p | awk -v name="$LIB_NAME" '$1 == name { print $NF; exit }')"
            if [ -z "$LIB_PATH" ]; then
              echo "Missing runtime library on runner: $LIB_NAME"
              exit 1
            fi
            cp -L "$LIB_PATH" "$APPDIR/usr/lib/$LIB_NAME"
          done

          # Download a file and fail if it appears empty or unexpectedly small.
          download_checked() {
            local url="$1"
            local output="$2"
            curl -fL --retry 3 --retry-delay 2 -o "$output" "$url"
            test -s "$output" || { echo "Downloaded file is empty: $output"; exit 1; }
            if [ "$(wc -c < "$output")" -lt 1024 ]; then
              echo "Downloaded file is unexpectedly small: $output"
              echo "URL: $url"
              cat "$output"
              exit 1
            fi
          }

          download_checked \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          download_checked \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          rm -rf squashfs-root appimagetool-root
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root appimagetool-root

          export ARCH=x86_64

          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage \
            --appdir "$APPDIR" \
            --desktop-file "$APPDIR/Perastage.desktop" \
            --icon-file "$APPDIR/Perastage.png"

          APPIMAGE_NAME="Perastage-${VERSION}-x86_64.AppImage"
          ./appimagetool-root/AppRun "$APPDIR" "$APPIMAGE_NAME"

          test -f "$APPIMAGE_NAME" || { echo "AppImage was not created"; exit 1; }
          test -x "$APPIMAGE_NAME" || { echo "AppImage is not executable"; exit 1; }

          rm -rf squashfs-root
          unset APPIMAGE_EXTRACT_AND_RUN || true
          ./$APPIMAGE_NAME --appimage-extract

          test -f squashfs-root/AppRun || { echo "Extracted AppRun is missing"; exit 1; }
          test -x squashfs-root/AppRun || { echo "Extracted AppRun is not executable"; exit 1; }
          test -f squashfs-root/Perastage.desktop || { echo "Extracted desktop file is missing"; exit 1; }
          test -f squashfs-root/Perastage.png || { echo "Extracted icon is missing"; exit 1; }
          test -f squashfs-root/usr/bin/Perastage || { echo "Extracted executable is missing"; exit 1; }
          test -f squashfs-root/usr/share/mime/packages/perastage-mime.xml || { echo "Extracted MIME metadata is missing"; exit 1; }
          grep -q 'application/x-perastage-mvr' squashfs-root/usr/share/mime/packages/perastage-mime.xml || { echo "MIME type for .mvr is missing"; exit 1; }
          grep -q 'application/x-perastage-project' squashfs-root/usr/share/mime/packages/perastage-mime.xml || { echo "MIME type for .pstg is missing"; exit 1; }
          for lang in es zh_CN; do
            test -f "squashfs-root/usr/bin/resources/locale/${lang}/LC_MESSAGES/perastage.mo" || { echo "Extracted AppImage ${lang} catalog is missing"; exit 1; }
          done

          echo "---- Extracted Perastage RPATH ----"
          patchelf --print-rpath squashfs-root/usr/bin/Perastage || true
          echo "---- Extracted Perastage linked GTK/GDK libs ----"
          ldd squashfs-root/usr/bin/Perastage | grep -E 'gtk|gdk|pixbuf|glib|gio|pango|cairo|atk|harfbuzz|rsvg' || true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: Perastage-linux-appimage
          path: Perastage-*-x86_64.AppImage

      - name: Upload final CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage-diagnostics
          if-no-files-found: ignore
          path: |
            out/ci-logs/**
            **/CMakeFiles/CMakeConfigureLog.yaml
            **/CMakeCache.txt
            **/CMakeFiles/CMakeOutput.log
            **/CMakeFiles/CMakeError.log
            build/**/*.log
            build-*/**/*.log
            vcpkg/buildtrees/**/*.log
            vcpkg/buildtrees/**/config-*.txt
            vcpkg/buildtrees/**/issue_body.md
            .vcpkg-cache/installed/vcpkg/issue_body.md
