# Windows installer workflow for Perastage
# Builds, stages and packages the Windows installer with Inno Setup.

name: Windows Release Installer

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to build from when called as a reusable workflow.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional git ref to build from.
        required: false
        type: string
        default: ""
  push:
    branches:
      - ci/windows-installer

permissions:
  contents: read
  packages: read

jobs:
  build-windows-installer:
    runs-on: windows-latest

    env:
      # Single source of truth for all vcpkg paths used across steps.
      VCPKG_ROOT:         ${{ github.workspace }}\vcpkg
      VCPKG_INSTALLED:    ${{ github.workspace }}\.vcpkg-cache\installed
      VCPKG_DOWNLOADS:    ${{ github.workspace }}\.vcpkg-cache\downloads
      VCPKG_CACHE_SCHEMA: securestore-v2
      VCPKG_PACKAGES:     ${{ github.workspace }}\.vcpkg-cache\packages
      VCPKG_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache\binary
      CI_LOG_DIR: ${{ github.workspace }}\out\ci-logs
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache\binary,readwrite

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.ref }}

      - name: Prepare CI log directory
        shell: bash
        run: mkdir -p "$CI_LOG_DIR"

      - name: Read vcpkg baseline
        id: vcpkg-baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(python3 .github/scripts/get_vcpkg_baseline.py vcpkg.json)"
          echo "baseline=${baseline}" >> "$GITHUB_OUTPUT"
          echo "VCPKG_BASELINE=${baseline}" >> "$GITHUB_ENV"

      # ── 2. Cache vcpkg installed tree + downloads ───────────────────────────
      # vcpkg cache keys include only dependency and ABI inputs so compatible
      # Debug and Release jobs can share compiled packages.
      - name: Restore vcpkg downloads
        id: vcpkg-downloads-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .vcpkg-cache/downloads
          key: vcpkg-downloads-v3-${{ runner.os }}-${{ runner.arch }}-x64-windows-default-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-downloads-v3-${{ runner.os }}-${{ runner.arch }}-x64-windows-default-${{ steps.vcpkg-baseline.outputs.baseline }}-

      - name: Restore vcpkg installed packages and binary archives
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .vcpkg-cache\installed
            .vcpkg-cache\packages
            .vcpkg-cache\binary
          key: vcpkg-compiled-v3-${{ runner.os }}-${{ runner.arch }}-x64-windows-default-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-compiled-v3-${{ runner.os }}-${{ runner.arch }}-x64-windows-default-${{ steps.vcpkg-baseline.outputs.baseline }}-

      # ── 3. Bootstrap vcpkg (always needed; the binary is never cached) ──────
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgDir = $env:VCPKG_ROOT
          if (Test-Path "$vcpkgDir\.git") {
            Write-Host "Updating existing vcpkg checkout..."
            git -C $vcpkgDir fetch --depth 1 origin $env:VCPKG_BASELINE
            git -C $vcpkgDir checkout --force $env:VCPKG_BASELINE
          } else {
            if (Test-Path $vcpkgDir) { Remove-Item $vcpkgDir -Recurse -Force }
            git clone https://github.com/microsoft/vcpkg.git $vcpkgDir
            git -C $vcpkgDir checkout --force $env:VCPKG_BASELINE
          }
          & "$vcpkgDir\bootstrap-vcpkg.bat" -disableMetrics

      # ── 4. Install vcpkg packages (skipped automatically when cache hits) ───
      # vcpkg detects that packages are already installed and does nothing when
      # .vcpkg-cache\installed is restored from cache, so this step is fast on
      # cache hits and only does real work on the first run or after a cache bust.
      - name: Configure GitHub Packages binary cache
        id: vcpkg-remote-cache
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/setup_vcpkg_github_packages.py --vcpkg "$env:VCPKG_ROOT\vcpkg.exe" --local-cache "$env:VCPKG_BINARY_CACHE" --mode read

      - name: Install vcpkg packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_DOWNLOADS  -Force | Out-Null
          New-Item -ItemType Directory -Path $env:VCPKG_INSTALLED   -Force | Out-Null
          New-Item -ItemType Directory -Path $env:VCPKG_PACKAGES    -Force | Out-Null
          New-Item -ItemType Directory -Path $env:VCPKG_BINARY_CACHE -Force | Out-Null

          # The wrapper forwards --x-install-root, --x-packages-root, and --downloads-root to vcpkg.
          python .github/scripts/vcpkg_install_retry.py --vcpkg "$env:VCPKG_ROOT\vcpkg.exe" --triplet x64-windows --manifest-root "$env:GITHUB_WORKSPACE" `
            --install-root "$env:VCPKG_INSTALLED" `
            --packages-root "$env:VCPKG_PACKAGES" `
            --downloads-root "$env:VCPKG_DOWNLOADS" `
            --attempts 4 --initial-delay-seconds 30 --max-delay-seconds 120 `
            --log "$env:CI_LOG_DIR\vcpkg-install-x64-windows.log"
      - name: Save vcpkg downloads cache
        if: ${{ steps.vcpkg-downloads-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .vcpkg-cache/downloads
          key: ${{ steps.vcpkg-downloads-cache.outputs.cache-primary-key }}
      - name: Save vcpkg installed packages and binary archives
        id: vcpkg-cache-save
        if: ${{ steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .vcpkg-cache\installed
            .vcpkg-cache\packages
            .vcpkg-cache\binary
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Summarize vcpkg cache behavior
        if: ${{ always() }}
        shell: pwsh
        run: |
          python .github/scripts/write_vcpkg_cache_summary.py --platform windows --triplet x64-windows --baseline "${{ steps.vcpkg-baseline.outputs.baseline }}" --schema v3 --primary-key "${{ steps.vcpkg-cache.outputs.cache-primary-key }}" --downloads-hit "${{ steps.vcpkg-downloads-cache.outputs.cache-hit }}" --compiled-hit "${{ steps.vcpkg-cache.outputs.cache-hit }}" --compiled-save-outcome "${{ steps.vcpkg-cache-save.outcome }}" --remote-mode read --remote-enabled "${{ steps.vcpkg-remote-cache.outputs.remote-enabled }}" --remote-setup-result "${{ steps.vcpkg-remote-cache.outputs.setup-result }}" --fallback-local-only "${{ steps.vcpkg-remote-cache.outputs.fallback-local-only }}" --publish-permitted no --publication-verification not-applicable


      - name: Validate vcpkg gettext tools
        shell: pwsh
        run: |
          $gettextBin = Join-Path $env:VCPKG_INSTALLED 'x64-windows\tools\gettext\bin'
          foreach ($tool in @('msgfmt.exe', 'xgettext.exe', 'msgmerge.exe', 'msgattrib.exe')) {
              $toolPath = Join-Path $gettextBin $tool
              if (-not (Test-Path $toolPath)) {
                  throw "vcpkg gettext tool was not found at: $toolPath"
              }
              Write-Host "vcpkg gettext tool: $toolPath"
              & $toolPath --version | Select-Object -First 1
          }

      # ── 5. Configure CMake ──────────────────────────────────────────────────
      # VCPKG_INSTALLED_DIR tells the vcpkg toolchain where to find the
      # installed packages. Without it, CMake looks in vcpkg/installed (the
      # default) and fails to find wxWidgets because we redirected the install
      # root to .vcpkg-cache/installed in the step above.
      - name: Configure CMake
        shell: pwsh
        run: |
          $cmakeHelp = cmake --help
          $generator = if ($cmakeHelp -match 'Visual Studio 18 2026') { 'Visual Studio 18 2026' } else { 'Visual Studio 17 2022' }
          Write-Host "Using CMake generator: $generator"
          python .github/scripts/run_and_log.py --log "$env:CI_LOG_DIR\cmake-configure-windows-release.log" -- `
            cmake -S . -B build -G $generator -A x64 `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows `
              -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED" `
              -DVCPKG_MANIFEST_MODE=OFF `
              -DPERASTAGE_REQUIRE_SECURE_CREDENTIAL_STORE=ON `
              -DPERASTAGE_ENABLE_COMPILER_CACHE=OFF `
              -DBUILD_TESTING=OFF

      # ── 6. Build ────────────────────────────────────────────────────────────
      - name: Build project
        shell: pwsh
        run: |
          cmake --build build --config Release --target perastage_translations --verbose
          cmake --build build --config Release

      # ── 7. Stage distribution folder ────────────────────────────────────────
      - name: Stage distribution folder
        shell: pwsh
        run: |
          cmake --build build --config Release --target perastage_stage
          foreach ($lang in @('es', 'zh_CN')) {
            if (-not (Test-Path "out/install/Release/resources/locale/$lang/LC_MESSAGES/perastage.mo")) { throw "Missing staged $lang catalog" }
          }
          Get-ChildItem out\install\Release

      - name: Collect Windows symbols
        shell: pwsh
        run: |
          cmake --build build --config Release --target perastage_symbols
          $symbolsDir = "$env:GITHUB_WORKSPACE\out\symbols\windows"
          if (!(Test-Path $symbolsDir)) { throw "Symbols directory not found: $symbolsDir" }
          $pdbs = @(Get-ChildItem -Path $symbolsDir -Recurse -Filter "*.pdb" -File)
          if ($pdbs.Count -lt 1) { throw "No PDB files were collected" }
          $stageDir = "$env:GITHUB_WORKSPACE\out\install\Release"
          $pdbsInStage = @(Get-ChildItem -Path $stageDir -Recurse -Filter "*.pdb" -File)
          if ($pdbsInStage.Count -ne 0) { throw "Windows staged distribution unexpectedly contains PDB files" }
          if (Test-Path (Join-Path $stageDir "symbols")) { throw "Windows staged distribution unexpectedly contains a symbols directory" }
          Get-ChildItem -Path $symbolsDir -Recurse

      - name: Upload Windows symbols
        uses: actions/upload-artifact@v7
        with:
          name: Perastage-windows-symbols
          path: out/symbols/windows

      # ── 8. Upload staged build ───────────────────────────────────────────────
      - name: Upload staged distribution
        uses: actions/upload-artifact@v7
        with:
          name: Perastage-windows-staged
          path: out/install/Release


      - name: Verify Windows installer input tree is clean
        shell: pwsh
        run: |
          $stageDir = "$env:GITHUB_WORKSPACE\out\install\Release"
          $pdbsInStage = @(Get-ChildItem -Path $stageDir -Recurse -Filter "*.pdb" -File)
          if ($pdbsInStage.Count -ne 0) { throw "Windows staged distribution unexpectedly contains PDB files" }
          if (Test-Path (Join-Path $stageDir "symbols")) { throw "Windows staged distribution unexpectedly contains a symbols directory" }

      # ── 9. Install Inno Setup ────────────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      # ── 10. Build Windows installer ─────────────────────────────────────────
      - name: Build Windows installer
        shell: pwsh
        run: |
          $stageDir = "$env:GITHUB_WORKSPACE\out\install\Release"
          $pdbsInStage = @(Get-ChildItem -Path $stageDir -Recurse -Filter "*.pdb" -File)
          if ($pdbsInStage.Count -ne 0) { throw "Windows staged distribution unexpectedly contains PDB files" }
          if (Test-Path (Join-Path $stageDir "symbols")) { throw "Windows staged distribution unexpectedly contains a symbols directory" }
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\out\installer" -Force | Out-Null

          # Extract version from the repository root VERSION file via the helper CMake script
          $versionRaw = cmake -P "$env:GITHUB_WORKSPACE\packaging\windows\get_project_version.cmake" 2>&1
          $version = ($versionRaw | Select-String -Pattern '(\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not determine Perastage version from VERSION"
          }
          Write-Host "Using installer version: $version"
          ISCC "/DMyAppVersion=$version" "$env:GITHUB_WORKSPACE\packaging\windows\Perastage.iss"

      # ── 11. Verify installer was created ─────────────────────────────────────
      - name: Collect Windows installer
        shell: pwsh
        run: |
          $installerDir = "$env:GITHUB_WORKSPACE\out\installer"
          $exe = Get-ChildItem -Path $installerDir -Filter "Perastage_*_Setup.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "Installer not found in $installerDir" }
          Write-Host "Found installer: $($exe.FullName)"

      # ── 12. Upload installer artifact ────────────────────────────────────────
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Perastage-windows-installer
          path: out/installer

      - name: Upload final CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-installer-diagnostics
          if-no-files-found: ignore
          path: |
            out/ci-logs/**
            **/CMakeFiles/CMakeConfigureLog.yaml
            **/CMakeCache.txt
            **/CMakeFiles/CMakeOutput.log
            **/CMakeFiles/CMakeError.log
            build/**/*.log
            build-*/**/*.log
            vcpkg/buildtrees/**/*.log
            vcpkg/buildtrees/**/config-*.txt
            vcpkg/buildtrees/**/issue_body.md
            .vcpkg-cache/installed/vcpkg/issue_body.md
