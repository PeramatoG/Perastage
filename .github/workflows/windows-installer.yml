# Windows installer workflow for Perastage
# Builds, stages and packages the Windows installer with Inno Setup.

name: Windows Installer Build

on:
  workflow_dispatch:
  push:
    branches:
      - ci/windows-installer

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      # Checkout the repository contents
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # Cache vcpkg directories to speed up dependency builds across runs
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-cache/downloads
            .vcpkg-cache/installed
            .vcpkg-cache/packages
          key: ${{ runner.os }}-vcpkg-x64-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/workflows/windows-installer.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-x64-windows-
            ${{ runner.os }}-vcpkg-        

      # Print a simple message to verify the workflow starts correctly
      - name: Print test message
        shell: pwsh
        run: |
          Write-Host "GitHub Actions is working for Perastage."
          Write-Host "Current branch: $env:GITHUB_REF_NAME"

      # Clone vcpkg, bootstrap it and install required packages
      - name: Set up vcpkg dependencies
        shell: pwsh
        run: |
          $vcpkgDir = "$env:GITHUB_WORKSPACE\vcpkg"
          if (Test-Path "$vcpkgDir\.git") {
            Write-Host "Existing vcpkg repository found. Updating checkout..."
            git -C $vcpkgDir fetch --depth 1 origin master
            git -C $vcpkgDir checkout --force FETCH_HEAD
          } else {
            if (Test-Path $vcpkgDir) {
              Remove-Item -Path $vcpkgDir -Recurse -Force
            }
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgDir
          }

          $cacheRoot = "$env:GITHUB_WORKSPACE\.vcpkg-cache"
          New-Item -ItemType Directory -Path "$cacheRoot\downloads" -Force | Out-Null
          New-Item -ItemType Directory -Path "$cacheRoot\installed" -Force | Out-Null
          New-Item -ItemType Directory -Path "$cacheRoot\packages" -Force | Out-Null

          & "$vcpkgDir\bootstrap-vcpkg.bat"
          & "$vcpkgDir\vcpkg.exe" install `
            wxwidgets:x64-windows `
            tinyxml2:x64-windows `
            glew:x64-windows `
            curl:x64-windows `
            zlib:x64-windows `
            nanovg:x64-windows `
            podofo:x64-windows `
            meshoptimizer:x64-windows `
            --x-install-root="$cacheRoot\installed" `
            --x-packages-root="$cacheRoot\packages" `
            --downloads-root="$cacheRoot\downloads"

      # Configure the CMake project using the vcpkg toolchain
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DPERAVIZ_ENABLE_NATIVE=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      # Build project
      - name: Build project
        shell: pwsh
        run: |
          cmake --build build --config Release

      # Create distribution folders and files
      - name: Stage distribution folder
        shell: pwsh
        run: |
          cmake --build build --config Release --target perastage_stage
          Get-ChildItem out\install\Release

      # Upload staged build as artifact
      - name: Upload staged distribution
        uses: actions/upload-artifact@v4
        with:
          name: Perastage-windows-staged
          path: out/install/Release

      # Install Inno Setup compiler to build the Windows installer
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      # Build the Windows installer using the repository-relative Inno Setup script.
      # The script writes the installer to out\installer (relative to the repo root).
      - name: Build Windows installer
        shell: pwsh
        run: |
          # Ensure the output directory exists before ISCC runs
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\out\installer" -Force | Out-Null
          $version = (cmake -P "$env:GITHUB_WORKSPACE\packaging\windows\get_project_version.cmake" |
            Select-String -Pattern '-- ([0-9]+\.[0-9]+\.[0-9]+)$').Matches[0].Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not determine PROJECT_VERSION from CMakeLists.txt"
          }
          Write-Host "Using installer version: $version"
          ISCC "/DMyAppVersion=$version" "$env:GITHUB_WORKSPACE\packaging\windows\Perastage.iss"

      # Copy installer into a dedicated folder for upload
      - name: Collect Windows installer
        shell: pwsh
        run: |
          $installerDir = "$env:GITHUB_WORKSPACE\out\installer"
          $exe = Get-ChildItem -Path $installerDir -Filter "Perastage_*_Setup.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "Installer not found in $installerDir" }
          Write-Host "Found installer: $($exe.FullName)"

      # Upload the generated installer as a workflow artifact
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Perastage-windows-installer
          path: out/installer
