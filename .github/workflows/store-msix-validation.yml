name: Store MSIX Packaging Validation

on:
  pull_request:
    paths:
      - 'packaging/windows/msix/**'
      - 'tests/check_windows_msix_packaging.py'
      - '.github/workflows/windows-installer.yml'
      - '.github/workflows/store-msix-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  manifest-and-packaging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate input contracts and manifest with Windows SDK
        shell: pwsh
        run: |
          python tests/check_windows_msix_packaging.py -v
          if ($LASTEXITCODE -ne 0) { throw 'MSIX packaging validation failed' }

  # Reuse the authoritative release lane: one build/stage for Inno and Store.
  store-release:
    needs: manifest-and-packaging
    uses: ./.github/workflows/windows-installer.yml
    with:
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      build_msix: true
