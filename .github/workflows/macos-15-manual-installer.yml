# macOS installer workflow for Perastage
# Builds and stages the macOS 15 Apple Silicon application using vcpkg and CMake.

name: macOS 15 Release DMG

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to build from when called as a reusable workflow.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional git ref to build from. Leave empty to build the selected branch.
        required: false
        type: string
        default: ""

jobs:
  build-macos-installer:
    runs-on: macos-15

    env:
      # Single source of truth for all vcpkg paths used across steps.
      VCPKG_ROOT:        ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED:   ${{ github.workspace }}/.vcpkg-cache/installed
      VCPKG_DOWNLOADS:   ${{ github.workspace }}/.vcpkg-cache/downloads
      VCPKG_CACHE_SCHEMA: securestore-v2
      VCPKG_PACKAGES:    ${{ github.workspace }}/.vcpkg-cache/packages
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache/binary
      CI_LOG_DIR: ${{ github.workspace }}/out/ci-logs
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache/binary,readwrite
      VCPKG_TRIPLET:     arm64-osx

      # Keep this workflow compatible with macOS 15.x Apple Silicon systems.
      MACOSX_DEPLOYMENT_TARGET: "15.0"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.ref }}

      - name: Prepare CI log directory
        shell: bash
        run: mkdir -p "$CI_LOG_DIR"

      - name: Read vcpkg baseline
        id: vcpkg-baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(python3 .github/scripts/get_vcpkg_baseline.py vcpkg.json)"
          echo "baseline=${baseline}" >> "$GITHUB_OUTPUT"
          echo "VCPKG_BASELINE=${baseline}" >> "$GITHUB_ENV"

      # ── 2. Record macOS toolchain diagnostics ───────────────────────────────
      - name: Record macOS toolchain diagnostics
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          uname -a
          xcodebuild -version
          clang++ --version
          cmake --version
          ninja --version || true
          sysctl -n machdep.cpu.brand_string || true
          xcrun --sdk macosx --show-sdk-path

      # ── 3. Install macOS build tools ────────────────────────────────────────
      - name: Install macOS build tools
        run: |
          set -euo pipefail
          brew update
          brew install autoconf autoconf-archive automake gettext libtool ninja dylibbundler
          GETTEXT_PREFIX="$(brew --prefix gettext)"
          echo "Homebrew gettext prefix: $GETTEXT_PREFIX"
          echo "$GETTEXT_PREFIX/bin" >> "$GITHUB_PATH"
          for tool in msgfmt xgettext msgmerge msgattrib; do
            test -x "$GETTEXT_PREFIX/bin/$tool" || { echo "Missing Homebrew gettext tool: $GETTEXT_PREFIX/bin/$tool"; exit 1; }
            "$GETTEXT_PREFIX/bin/$tool" --version | head -n 1
          done

      # ── 4. Cache vcpkg installed tree + downloads ───────────────────────────
      - name: Restore vcpkg downloads
        id: vcpkg-downloads-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .vcpkg-cache/downloads
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-downloads-${{ steps.vcpkg-baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-downloads-${{ steps.vcpkg-baseline.outputs.baseline }}-
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-downloads-

      - name: Cache vcpkg installed packages and binary archives
        uses: actions/cache@v5
        id: vcpkg-cache
        with:
          path: |
            .vcpkg-cache/installed
            .vcpkg-cache/packages
            .vcpkg-cache/binary
          key: macos-15-deployment-${{ env.MACOSX_DEPLOYMENT_TARGET }}-vcpkg-securestore-v2-${{ steps.vcpkg-baseline.outputs.baseline }}-arm64-osx-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/workflows/macos-15-manual-installer.yml') }}
          restore-keys: |
            macos-15-deployment-${{ env.MACOSX_DEPLOYMENT_TARGET }}-vcpkg-securestore-v2-${{ steps.vcpkg-baseline.outputs.baseline }}-arm64-osx-

      # ── 5. Prepare vcpkg cache folders ──────────────────────────────────────
      # These folders must exist before bootstrap because VCPKG_DOWNLOADS is
      # already visible to vcpkg during bootstrap.
      - name: Prepare vcpkg folders
        run: |
          set -euo pipefail
          mkdir -p "$VCPKG_DOWNLOADS"
          mkdir -p "$VCPKG_INSTALLED"
          mkdir -p "$VCPKG_PACKAGES"

      # ── 6. Bootstrap vcpkg ──────────────────────────────────────────────────
      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [ -d "$VCPKG_ROOT/.git" ]; then
            echo "Updating existing vcpkg checkout..."
            git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_BASELINE"
            git -C "$VCPKG_ROOT" checkout --force "$VCPKG_BASELINE"
          else
            rm -rf "$VCPKG_ROOT"
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            git -C "$VCPKG_ROOT" checkout --force "$VCPKG_BASELINE"
          fi

          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # ── 7. Diagnose restored vcpkg SDK metadata ─────────────────────────────
      - name: Diagnose restored vcpkg SDK metadata
        run: |
          set -euo pipefail
          echo "xcode-select path:"
          xcode-select -p
          echo "Xcode version:"
          xcodebuild -version
          echo "Current macOS SDK path:"
          xcrun --sdk macosx --show-sdk-path

          for cache_dir in "$VCPKG_INSTALLED" "$VCPKG_PACKAGES"; do
            if [ -d "$cache_dir" ]; then
              echo "Scanning $cache_dir for cached Xcode SDK paths..."
              if ! grep -R -n -F "/Applications/Xcode_" "$cache_dir" 2>/dev/null; then
                echo "No cached Xcode SDK paths found in $cache_dir."
              fi
            else
              echo "$cache_dir does not exist; skipping SDK metadata scan."
            fi
          done

      # ── 8. Install vcpkg packages ───────────────────────────────────────────
      - name: Install vcpkg packages
        run: |
          set -euo pipefail
          current_sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          stale_sdk_paths="$(
            for cache_dir in "$VCPKG_INSTALLED" "$VCPKG_PACKAGES"; do
              if [ -d "$cache_dir" ]; then
                grep -R -h -o -E "/Applications/Xcode_[^[:space:]]*/SDKs/MacOSX\.sdk" "$cache_dir" 2>/dev/null || true
              fi
            done | sort -u | grep -F -v -x "$current_sdk_path" || true
          )"

          if [ -n "$stale_sdk_paths" ]; then
            echo "Stale macOS SDK path metadata was found in the restored vcpkg cache."
            echo "Current SDK path: $current_sdk_path"
            echo "Stale SDK path(s):"
            echo "$stale_sdk_paths"
            echo "Deleting and recreating vcpkg installed and packages caches before rebuilding dependencies."
            rm -rf "$VCPKG_INSTALLED" "$VCPKG_PACKAGES"
            mkdir -p "$VCPKG_INSTALLED" "$VCPKG_PACKAGES"
          else
            echo "No stale macOS SDK path metadata found in the restored vcpkg cache."
          fi

          python3 .github/scripts/vcpkg_install_retry.py --vcpkg "$VCPKG_ROOT/vcpkg" --triplet arm64-osx --manifest-root "$GITHUB_WORKSPACE" \
            --install-root "$VCPKG_INSTALLED" \
            --packages-root "$VCPKG_PACKAGES" \
            --downloads-root "$VCPKG_DOWNLOADS" \
            --attempts 4 --initial-delay-seconds 30 --max-delay-seconds 120 \
            --log "$CI_LOG_DIR/vcpkg-install-arm64-osx.log"

      - name: Save vcpkg downloads cache
        if: ${{ always() && steps.vcpkg-downloads-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .vcpkg-cache/downloads
          key: ${{ steps.vcpkg-downloads-cache.outputs.cache-primary-key }}

      - name: Configure CMake
        run: |
          set -euo pipefail
          rm -rf build
          current_sdk_path="$(xcrun --sdk macosx --show-sdk-path)"

          python3 .github/scripts/run_and_log.py --log "$CI_LOG_DIR/cmake-configure-macos15.log" -- \
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_SYSROOT="$current_sdk_path" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -g" \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
              -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED" \
              -DVCPKG_MANIFEST_MODE=OFF \
              -DPERASTAGE_REQUIRE_SECURE_CREDENTIAL_STORE=ON \
              -DPERASTAGE_ENABLE_COMPILER_CACHE=OFF \
              -DBUILD_TESTING=OFF

      # ── 10. Build project ───────────────────────────────────────────────────
      - name: Build project
        run: |
          set -o pipefail
          mkdir -p build
          cmake --build build --config Release --parallel 1 --verbose 2>&1 | tee build/macos-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            echo "::group::Focused compiler diagnostics"
            first_error_line="$(grep -n -m 1 -E '(^|[:[:space:]])error:' build/macos-build.log | cut -d: -f1 || true)"
            if [ -n "$first_error_line" ]; then
              start_line=$(( first_error_line > 40 ? first_error_line - 40 : 1 ))
              end_line=$(( first_error_line + 120 ))
              sed -n "${start_line},${end_line}p" build/macos-build.log
            else
              echo "No compiler error marker was found in build/macos-build.log."
              tail -n 200 build/macos-build.log
            fi
            echo "::endgroup::"
            echo "::group::Linker and SDK failure summary"
            echo "Lines containing 'No rule to make target':"
            grep -n -F "No rule to make target" build/macos-build.log || true
            echo "Lines containing '/Applications/Xcode_':"
            grep -n -F "/Applications/Xcode_" build/macos-build.log || true
            echo "Lines containing 'libiconv.tbd':"
            grep -n -F "libiconv.tbd" build/macos-build.log || true
            echo "Last 120 lines of build log:"
            tail -n 120 build/macos-build.log
            echo "::endgroup::"
            exit "$build_status"
          fi

      - name: Stage distribution folder
        run: |
          set -euo pipefail
          cmake --build build --config Release --target perastage_stage
          find out/install/Release -maxdepth 6 -print || true
          test -d out/install/Release/Perastage.app
          test -f out/install/Release/Perastage.app/Contents/Info.plist
          test -f out/install/Release/Perastage.app/Contents/Resources/Perastage.icns
          test -f out/install/Release/Perastage.app/Contents/Resources/PerastageProject.icns
          test -f out/install/Release/Perastage.app/Contents/Resources/PerastageMVR.icns
          for lang in es zh_CN; do
            test -f "out/install/Release/Perastage.app/Contents/Resources/locale/${lang}/LC_MESSAGES/perastage.mo" || { echo "Missing staged ${lang} catalog"; exit 1; }
          done
          test -f out/install/Release/Perastage.app/Contents/Resources/resources/Perastage_logo.png
          test -d out/install/Release/Perastage.app/Contents/Resources/resources/icons

      # ── 12. Collect macOS symbols ───────────────────────────────────────────
      - name: Collect macOS symbols
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          APP_BIN="out/install/Release/Perastage.app/Contents/MacOS/Perastage"
          SYMBOLS_DIR="out/symbols/macos15"
          rm -rf "$SYMBOLS_DIR"
          mkdir -p "$SYMBOLS_DIR"
          dsymutil "$APP_BIN" -o "$SYMBOLS_DIR/Perastage.dSYM"
          strip -S "$APP_BIN" || true
          test -d "$SYMBOLS_DIR/Perastage.dSYM"

      - name: Upload macOS symbols
        uses: actions/upload-artifact@v7
        with:
          name: Perastage-macos15-symbols
          path: out/symbols/macos15
          if-no-files-found: error

      # ── 13. Validate staged app bundle ──────────────────────────────────────
      - name: Validate staged app bundle
        run: |
          set -euo pipefail
          test -d out/install/Release/Perastage.app
          test -f out/install/Release/Perastage.app/Contents/Info.plist
          test -f out/install/Release/Perastage.app/Contents/MacOS/Perastage
          test -x out/install/Release/Perastage.app/Contents/MacOS/Perastage
          test -f out/install/Release/Perastage.app/Contents/Resources/Perastage.icns
          test -f out/install/Release/Perastage.app/Contents/Resources/PerastageProject.icns
          test -f out/install/Release/Perastage.app/Contents/Resources/PerastageMVR.icns
          for lang in es zh_CN; do
            test -f "out/install/Release/Perastage.app/Contents/Resources/locale/${lang}/LC_MESSAGES/perastage.mo" || { echo "Missing staged ${lang} catalog"; exit 1; }
          done
          test -f out/install/Release/Perastage.app/Contents/Resources/resources/Perastage_logo.png
          test -d out/install/Release/Perastage.app/Contents/Resources/resources/icons
          ls -l out/install/Release/Perastage.app/Contents/MacOS/
          plutil -lint out/install/Release/Perastage.app/Contents/Info.plist
          codesign -dv --verbose=4 out/install/Release/Perastage.app || true

      - name: Remove quarantine from staged app bundle
        run: |
          set -euo pipefail
          xattr -cr "out/install/Release/Perastage.app" || true

      # ── 14. Bundle dynamic libraries and sign the app ───────────────────────
      - name: Bundle dylibs and ad-hoc sign staged app
        run: |
          set -euo pipefail
          APP_PATH="out/install/Release/Perastage.app"
          BIN_PATH="$APP_PATH/Contents/MacOS/Perastage"
          FRAMEWORKS_PATH="$APP_PATH/Contents/Frameworks"

          mkdir -p "$FRAMEWORKS_PATH"

          dylibbundler \
            -od -b \
            -x "$BIN_PATH" \
            -d "$FRAMEWORKS_PATH" \
            -p "@executable_path/../Frameworks/" \
            -s "$VCPKG_INSTALLED/$VCPKG_TRIPLET/lib" \
            -s "$VCPKG_INSTALLED/$VCPKG_TRIPLET/tools"

          # Sign nested dynamic libraries and helper binaries before signing the bundle.
          while IFS= read -r file_path; do
            if file "$file_path" | grep -q "Mach-O"; then
              if [ "$file_path" != "$BIN_PATH" ]; then
                codesign --force --sign - --timestamp=none "$file_path"
              fi
            fi
          done < <(find "$APP_PATH/Contents" -type f)

          # Sign nested frameworks as bundles after their inner binaries are signed.
          while IFS= read -r framework_path; do
            codesign --force --sign - --timestamp=none "$framework_path"
          done < <(find "$APP_PATH/Contents/Frameworks" -type d -name "*.framework" 2>/dev/null || true)

          # Sign the full app bundle with deep signing.
          codesign --force --deep --sign - --timestamp=none "$APP_PATH"

          # Validate ad-hoc signature integrity.
          codesign --verify --deep --verbose=2 "$APP_PATH"

          # Fail on missing non-system runtime dependencies.
          MISSING_DEPS=0
          while IFS= read -r macho_file; do
            if ! file "$macho_file" | grep -q "Mach-O"; then
              continue
            fi

            while IFS= read -r dep_line; do
              dep_path="$(echo "$dep_line" | awk '{print $1}')"
              case "$dep_path" in
                "$macho_file"|"$(basename "$macho_file")":|@executable_path/*|@loader_path/*|/System/*|/usr/lib/*) ;;
                *)
                  echo "Unexpected runtime dependency in $macho_file: $dep_path"
                  MISSING_DEPS=1
                  ;;
              esac
            done < <(otool -L "$macho_file" | tail -n +2)
          done < <(find "$APP_PATH/Contents" -type f)

          test "$MISSING_DEPS" -eq 0

      # ── 15. Validate macOS deployment targets ───────────────────────────────
      - name: Validate macOS deployment targets
        run: |
          set -euo pipefail
          APP_PATH="out/install/Release/Perastage.app"

          python3 - "$APP_PATH" "$MACOSX_DEPLOYMENT_TARGET" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          app_path = pathlib.Path(sys.argv[1])
          target_version = tuple(int(part) for part in sys.argv[2].split(".")[:2])

          def is_macho_file(path: pathlib.Path) -> bool:
              result = subprocess.run(["file", str(path)], capture_output=True, text=True, check=False)
              return "Mach-O" in result.stdout

          def read_min_versions(path: pathlib.Path) -> list[tuple[int, int]]:
              result = subprocess.run(["otool", "-l", str(path)], capture_output=True, text=True, check=True)
              versions: list[tuple[int, int]] = []
              current_command = ""

              for raw_line in result.stdout.splitlines():
                  line = raw_line.strip()

                  if line.startswith("cmd "):
                      current_command = line.split(" ", 1)[1]
                      continue

                  if current_command == "LC_BUILD_VERSION" and line.startswith("minos "):
                      match = re.search(r"minos\s+(\d+)\.(\d+)", line)
                      if match:
                          versions.append((int(match.group(1)), int(match.group(2))))

                  if current_command == "LC_VERSION_MIN_MACOSX" and line.startswith("version "):
                      match = re.search(r"version\s+(\d+)\.(\d+)", line)
                      if match:
                          versions.append((int(match.group(1)), int(match.group(2))))

              return versions

          failures: list[str] = []
          checked = 0

          for file_path in app_path.rglob("*"):
              if not file_path.is_file() or not is_macho_file(file_path):
                  continue

              checked += 1
              versions = read_min_versions(file_path)
              relative_path = file_path.relative_to(app_path)

              if not versions:
                  print(f"warning: no deployment target found for {relative_path}")
                  continue

              highest_version = max(versions)
              print(f"{relative_path}: minimum macOS {highest_version[0]}.{highest_version[1]}")

              if highest_version > target_version:
                  failures.append(
                      f"{relative_path} requires macOS {highest_version[0]}.{highest_version[1]}, "
                      f"expected <= {target_version[0]}.{target_version[1]}"
                  )

          if checked == 0:
              raise SystemExit("No Mach-O files were found in the app bundle.")

          if failures:
              print("Deployment target validation failed:")
              for failure in failures:
                  print(f"  - {failure}")
              raise SystemExit(1)

          print(f"Deployment target validation passed for {checked} Mach-O file(s).")
          PY

      # ── 16. Upload staged build ─────────────────────────────────────────────
      - name: Upload staged distribution
        uses: actions/upload-artifact@v7
        with:
          name: Perastage-macos15-staged
          path: out/install/Release

      # ── 17. Build DMG package ───────────────────────────────────────────────
      - name: Build macOS DMG
        run: |
          set -euo pipefail
          APP_PATH="out/install/Release/Perastage.app"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          DMG_NAME="Perastage-${VERSION}-macOS15-arm64.dmg"
          DMG_ROOT="$(mktemp -d)"

          cp -R "$APP_PATH" "$DMG_ROOT/Perastage.app"
          ln -s /Applications "$DMG_ROOT/Applications"

          mkdir -p out/installer
          hdiutil create \
            -volname "Perastage" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "out/installer/$DMG_NAME"

          xattr -c "out/installer/$DMG_NAME" || true
          rm -rf "$DMG_ROOT"
          find out/installer -name "*.dmg" -print

      # ── 18. Validate generated DMG ──────────────────────────────────────────
      - name: Validate generated DMG
        run: |
          set -euo pipefail
          EXPECTED_DMG="Perastage-$(tr -d '[:space:]' < VERSION)-macOS15-arm64.dmg"
          DMG_FILE="out/installer/$EXPECTED_DMG"
          if [ ! -f "$DMG_FILE" ]; then
            echo "Expected DMG not found: $DMG_FILE"
            find out/installer -name "*.dmg" -print || true
            exit 1
          fi

          MOUNT_DIR="$(mktemp -d)"
          # Detach the mounted DMG and remove the temporary mount directory.
          cleanup() {
            hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true
            rmdir "$MOUNT_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$DMG_FILE" -mountpoint "$MOUNT_DIR" -nobrowse -readonly

          test -d "$MOUNT_DIR/Perastage.app"
          test -x "$MOUNT_DIR/Perastage.app/Contents/MacOS/Perastage"
          test -f "$MOUNT_DIR/Perastage.app/Contents/Resources/resources/Perastage_logo.png"
          test -d "$MOUNT_DIR/Perastage.app/Contents/Resources/resources/icons"
          plutil -lint "$MOUNT_DIR/Perastage.app/Contents/Info.plist"
          codesign --verify --deep --verbose=2 "$MOUNT_DIR/Perastage.app"

      # ── 19. Collect DMG package ─────────────────────────────────────────────
      - name: Collect macOS DMG
        run: |
          set -euo pipefail
          mkdir -p out/installer
          dmg_file="out/installer/Perastage-$(tr -d '[:space:]' < VERSION)-macOS15-arm64.dmg"
          if [ ! -f "$dmg_file" ]; then
            echo "DMG not found under out/installer"
            exit 1
          fi
          echo "Using DMG: $dmg_file"
          xattr -c "$dmg_file" || true
          find out/installer -maxdepth 2 -name "*.dmg" -print

      # ── 20. Upload DMG package ──────────────────────────────────────────────
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: Perastage-macos15-dmg
          path: out/installer/*.dmg

      - name: Upload final CI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: macos15-installer-diagnostics
          if-no-files-found: ignore
          path: |
            out/ci-logs/**
            **/CMakeFiles/CMakeConfigureLog.yaml
            **/CMakeCache.txt
            **/CMakeFiles/CMakeOutput.log
            **/CMakeFiles/CMakeError.log
            build/**/*.log
            build-*/**/*.log
            vcpkg/buildtrees/**/*.log
            vcpkg/buildtrees/**/config-*.txt
            vcpkg/buildtrees/**/issue_body.md
            .vcpkg-cache/installed/vcpkg/issue_body.md
