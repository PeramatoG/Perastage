name: Bug report
description: Report a reproducible problem with Perastage
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Use **Issues** for bugs and actionable tasks.
        Use **Discussions** for questions and general feedback.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues to avoid duplicates
          required: true
        - label: I tested the latest official release, or I will identify the exact development build below
          required: false

  - type: input
    id: version
    attributes:
      label: Perastage version
      description: "Copy the version shown by Perastage, or provide the commit hash for a source build."
      placeholder: "Version shown in About, or source commit hash"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other (please specify below)
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version
      description: "Example: Windows 11 23H2, macOS 12.7.6"
      placeholder: "Windows 11 23H2"
    validations:
      required: false

  - type: input
    id: install_method
    attributes:
      label: Installation or build origin
      description: "Identify the exact package or build source."
      placeholder: "Official release package / compatibility build / portable package / source build"
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: System architecture
      description: "Examples: x64, arm64, or Apple Silicon."
      placeholder: "x64"
    validations:
      required: false

  - type: input
    id: graphics
    attributes:
      label: GPU and graphics driver
      description: "If relevant, provide the GPU model and graphics-driver version."
      placeholder: "GPU model and driver version"
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - Always
        - Intermittently
        - Only under specific conditions (describe below)
        - Unsure
    validations:
      required: true

  - type: textarea
    id: repro_steps
    attributes:
      label: Steps to reproduce
      description: "Please provide clear, numbered steps."
      placeholder: |
        1. Open Perastage
        2. Load file ...
        3. Click ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      placeholder: "What actually happened? Include exact error messages if available."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostic report, crash report, or logs (optional)
      description: "Use Help -> Export Diagnostic Report. If Perastage terminated unexpectedly, also check Help -> Open Logs Folder and attach the relevant file from its crash_reports folder. You may paste short console output here."
      render: text
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Attachments (optional)
      description: "When relevant, attach screenshots and a minimal MVR, GDTF, project, or other reproduction file. Remove confidential production data and do not upload anything you are not allowed to share publicly."
      placeholder: "Drag and drop files here, or describe the minimal example you can share."
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      placeholder: "Describe specific conditions, recent changes, or anything else that may help."
    validations:
      required: false
