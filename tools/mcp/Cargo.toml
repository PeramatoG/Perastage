[package]
name = "perastage-mcp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Stdio MCP adapter for the Perastage CLI"

[dependencies]
rmcp = { version = "3.5.0", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "process", "rt-multi-thread"] }
